name: Build cardboardstealth 1.21.1
on:
  workflow_dispatch:
  push:
    branches: [main, 'development/**']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, 'development/**']
concurrency:
  group: cardboardstealth-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Check detection rules
        run: |
          mkdir -p build/rule-tests
          javac -encoding UTF-8 -d build/rule-tests src/main/java/tw/zonezero/cardboardstealth/BoxDetectionRules.java tests/BoxDetectionRulesTest.java
          java -cp build/rule-tests BoxDetectionRulesTest
      - name: Check sound classification
        run: |
          javac -encoding UTF-8 -d build/rule-tests src/main/java/tw/zonezero/cardboardstealth/BoxSoundRules.java tests/BoxSoundRulesTest.java
          java -cp build/rule-tests BoxSoundRulesTest
      - name: Check disguise activation
        run: |
          javac -encoding UTF-8 -d build/rule-tests src/main/java/tw/zonezero/cardboardstealth/BoxActivationRules.java tests/BoxActivationRulesTest.java
          java -cp build/rule-tests BoxActivationRulesTest
      - name: Check handgun and suppressor policy
        run: |
          javac -encoding UTF-8 -d build/rule-tests src/main/java/tw/zonezero/cardboardstealth/BoxPolicy.java tests/BoxPolicyTest.java
          java -cp build/rule-tests BoxPolicyTest
      - name: Check cardboard eye-window geometry
        run: |
          javac -encoding UTF-8 -d build/rule-tests src/main/java/tw/zonezero/cardboardstealth/BoxViewGeometry.java tests/BoxViewGeometryTest.java
          java -cp build/rule-tests BoxViewGeometryTest
      - name: Check shared-player-model isolation policy
        run: |
          javac -encoding UTF-8 -d build/rule-tests src/main/java/tw/zonezero/cardboardstealth/BoxRenderRules.java tests/BoxRenderRulesTest.java
          java -cp build/rule-tests BoxRenderRulesTest
      - name: Verify no player render layer or SKIN state mutation even if Pre is cancelled
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('src/main/java/tw/zonezero/cardboardstealth')
          client=root/'client'
          init=(client/'ClientInit.java').read_text()
          layer=(client/'CardboardLayer.java').read_text()
          policy=(root/'BoxRenderRules.java').read_text()
          mixins=json.loads(Path('src/main/resources/cardboardstealth.mixins.json').read_text())
          assert not mixins.get('client',[]), 'No client render Mixins allowed'
          assert not (client/'ClientLayerRenderControl.java').exists()
          assert not (root/'BoxLayerMasking.java').exists()
          assert 'ClientLayerRenderControl' not in init
          assert 'RenderPlayerEvent.Pre' not in init
          assert 'RenderPlayerEvent.Post' not in init
          assert 'ClientInit::pre' not in init and 'ClientInit::post' not in init
          assert 'IdentityHashMap' not in init
          assert '.visible =' not in init and 'SAVED.remove' not in init
          assert 'renderer.addLayer(new CardboardLayer(' in init
          assert 'ClientBoxState.variant(player.getId())' in layer
          assert 'if (variant == 0) return;' in layer
          assert 'pose.pushPose();' in layer and 'pose.popPose();' in layer
          assert 'finally {' in layer
          for prop in ('front.xRot = oldFrontX','rear.xRot = oldRearX',
                       'left.zRot = oldLeftZ','right.zRot = oldRightZ'):
              assert prop in layer,prop
          assert 'PlayerModel' not in layer or 'PlayerModel<' in layer
          assert 'return true;' in policy and 'renderAttachedLayer' in policy
          assert not Path('tests/BoxLayerMaskingTest.java').exists()
          print('PASS: player SKIN, render layer lists and shared model flags cannot be mutated by this mod')
          PY
      - name: Verify Curios cardboard slot sorts below normal accessory slots
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('src/main/resources/data/cardboardstealth/curios')
          slot=json.loads((root/'slots/cardboard.json').read_text())
          entities=json.loads((root/'entities/players.json').read_text())
          assert slot['size']==1 and slot['operation']=='SET'
          assert slot['order']>=100000,'Curios high order should sort below regular slots'
          assert slot['icon']=='cardboardstealth:slot/empty_cardboard'
          assert slot['validators']==['curios:tag']
          assert 'cardboard' in entities['slots']
          assert 'minecraft:player' in entities['entities']
          print('PASS: one valid paper-box Curios slot, bottom-of-list order, unchanged equip identity')
          PY
      - name: Check five-tick cardboard settling
        run: |
          javac -encoding UTF-8 -d build/rule-tests src/main/java/tw/zonezero/cardboardstealth/BoxMotionRules.java tests/BoxMotionRulesTest.java
          java -cp build/rule-tests BoxMotionRulesTest
      - name: Test 3-layer decal stack, newest-first peeling and color preservation
        run: |
          javac -encoding UTF-8 -d build/rule-tests src/main/java/tw/zonezero/cardboardstealth/DecalStackRules.java tests/DecalStackRulesTest.java
          java -cp build/rule-tests DecalStackRulesTest
      - name: Test 96 sticker printer choices, exact dye consumption and output safety
        run: |
          javac -encoding UTF-8 -d build/rule-tests src/main/java/tw/zonezero/cardboardstealth/StickerPrinterRules.java tests/StickerPrinterRulesTest.java
          java -cp build/rule-tests StickerPrinterRulesTest
      - name: Verify industrial machine class and server-authoritative GUI wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('src/main/java/tw/zonezero/cardboardstealth')
          block=(root/'StickerPrinterBlock.java').read_text()
          be=(root/'StickerPrinterBlockEntity.java').read_text()
          menu=(root/'StickerPrinterMenu.java').read_text()
          screen=(root/'client/StickerPrinterScreen.java').read_text()
          reg=(root/'ModMachines.java').read_text()
          entry=(root/'CardboardStealth.java').read_text()
          assert 'server.openMenu(printer)' in block
          assert 'Containers.dropContents(level,pos,printer)' in block
          assert 'BlockStateProperties.HORIZONTAL_FACING' in block
          assert 'ContainerHelper.saveAllItems' in be and 'ContainerHelper.loadAllItems' in be
          assert 'StickerPrinterRules.canPrint(' in be and 'removeItem(DYE,cost)' in be
          assert 'removeItem(BLANK,1)' in be
          assert 'level==null||level.isClientSide||level.getBlockEntity(worldPosition)!=this||!canPrint()' in be
          assert 'if(!level.isClientSide && !state.is(next.getBlock()))' in block
          assert 'case DYE' in be and 'case BLANK' in be
          assert 'StickerPrinterRules.outputId(' in be
          assert 'clickMenuButton(Player player,int id)' in menu
          assert 'machine.print()' in menu and 'broadcastChanges()' in menu
          assert 'new SimpleContainerData(1)' in menu
          assert 'StickerPrinterMenu.PRINT' in screen
          assert 'handleInventoryButtonClick' in screen
          assert 'textures/decals/' in screen and 'item.cardboardstealth.sticker_subject_' in screen
          assert 'PRINTER_MENU' in reg and 'PRINTER_ENTITY' in reg
          assert 'ModMachines.BLOCKS.register(modBus)' in entry
          assert 'ModMachines.MENUS.register(modBus)' in entry
          assert "apply from: 'gradle/cardboard_printer_art.gradle'" in Path('build.gradle').read_text()
          print('PASS: 19/19 server-authoritative printing, persistence, GUI and 3D machine integration checks')
          PY
      - name: Regression-check functional client buttons, saved three-slot inventory and GUI help
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('src/main/java/tw/zonezero/cardboardstealth')
          menu=(root/'StickerPrinterMenu.java').read_text()
          block=(root/'StickerPrinterBlock.java').read_text()
          entity=(root/'StickerPrinterBlockEntity.java').read_text()
          screen=(root/'client/StickerPrinterScreen.java').read_text()
          assert 'if(id>=0 && id<StickerPrinterRules.PATTERNS)' in menu
          assert 'if(machine==null) {' in menu and 'data.set(0,id)' in menu
          assert 'if(machine==null)return printEnabled()' in menu
          assert 'if(!stillValid(player) || !machine.print())return false' in menu
          assert 'handleInventoryButtonClick(menu.containerId,pattern)' in screen
          assert 'StickerPrinterMenu.PRINT' in screen
          assert 'inventory.clear();' not in entity.split('loadAdditional')[1].split('selectedPattern')[0]
          assert 'inventory.add(ItemStack.EMPTY)' not in entity
          assert 'ContainerHelper.loadAllItems(tag,inventory,registries);' in entity
          assert 'NonNullList.withSize(SLOTS,ItemStack.EMPTY)' in entity
          assert 'level.getBlockEntity(worldPosition)==this' in entity
          assert 'level.getBlockState(worldPosition).is(ModMachines.PRINTER.get())' in entity
          assert 'player.distanceToSqr(worldPosition.getX()+0.5' in entity
          assert '!level.isClientSide && !state.is(next.getBlock())' in block
          assert 'menu.printStatusKey()' in screen
          assert 'g.renderTooltip(font,Component.translatable(' in screen
          assert '"NO INK"' not in screen
          for lang in ('zh_tw','en_us'):
              d=json.loads(Path('src/main/resources/assets/cardboardstealth/lang/'+lang+'.json').read_text())
              for key in ('missing_blank','missing_dye','insufficient_dye','take_output','ready'):
                  assert d.get('gui.cardboardstealth.printer.'+key),lang+' missing '+key
          print('PASS: client buttons forward correctly, fixed-size reload, range checks, server-only drops and useful GUI explanations')
          PY
      - name: Check 16 dye colors and model movement
        run: |
          javac -encoding UTF-8 -d build/rule-tests src/main/java/tw/zonezero/cardboardstealth/BoxColors.java src/main/java/tw/zonezero/cardboardstealth/BoxModelPose.java tests/BoxColorsAndPoseTest.java
          java -cp build/rule-tests BoxColorsAndPoseTest
      - name: Check tinted interior cardboard appearance
        run: |
          javac -encoding UTF-8 -d build/rule-tests src/main/java/tw/zonezero/cardboardstealth/BoxColors.java src/main/java/tw/zonezero/cardboardstealth/BoxInteriorPalette.java tests/BoxInteriorPaletteTest.java
          java -cp build/rule-tests BoxInteriorPaletteTest
      - name: Check exterior eye slot vs larger player-view mask
        run: |
          javac -encoding UTF-8 -d build/rule-tests src/main/java/tw/zonezero/cardboardstealth/BoxModelGeometry.java src/main/java/tw/zonezero/cardboardstealth/BoxModelPose.java src/main/java/tw/zonezero/cardboardstealth/BoxViewGeometry.java tests/BoxModelGeometryTest.java
          java -cp build/rule-tests BoxModelGeometryTest
      - name: Verify the dark under-mouth belongs to the body, not the flaps
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/main/java/tw/zonezero/cardboardstealth/client/CardboardLayer.java").read_text()
          assert 'root.addOrReplaceChild("underside_shade"' in p
          assert 'undersideShade.render(' in p
          assert 'BoxModelGeometry.UNDERMOUTH_DARK_ARGB' in p
          assert 'folded.addOrReplaceChild("front_flap"' in p
          print('PASS: 4/4 bottom shadow panel integration checks')
          PY
      - name: Validate full visual worklist source integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('src/main/java/tw/zonezero/cardboardstealth')
          render=(root/'client/CardboardLayer.java').read_text()
          overlay=(root/'client/BoxViewOverlay.java').read_text()
          props=(root/'BoxModelPose.java').read_text()
          tabs=(root/'ModCreativeTabs.java').read_text()
          entry=(root/'CardboardStealth.java').read_text()
          assert 'flapAngle(resting)' in render and 'liftPixels(resting)' in render
          assert 'lookRelativeYaw(bodyYaw, headYaw)' in render
          assert 'stepBackTilt' not in render and 'stepBackTilt' not in props
          assert 'eye_cavity' in render and 'inner_lip_above' in render
          assert 'slit_blackout' in render and 'slitBlackout.render(' in render
          assert 'UNDERMOUTH_DARK_ARGB' in render
          assert 'renderFaceBehindSlit' not in render and 'facePixel(' not in render
          assert 'inside_recess' not in render and 'head_shadow' not in render
          assert 'renderBackRecyclingStamp' in render and 'REAR_STAMP_LEFT_X' in render
          assert 'innerBase(variant)' in overlay and 'BoxViewGeometry.calculate' in overlay
          assert 'ModCreativeTabs.TABS.register(modBus)' in entry
          assert 'itemGroup.cardboardstealth' in tabs
          print('PASS: complete visual integration and black peep-slit backing checks')
          PY
      - name: Verify recipes and model assets
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          ns=Path('src/main/resources')
          colors='white orange magenta light_blue yellow lime pink gray light_gray cyan purple blue brown green red black'.split()
          for color in colors:
              name=f'{color}_cardboard_box'
              data=json.loads((ns/'data/cardboardstealth/recipe'/f'craft_{name}.json').read_text())
              assert data['pattern']==['PPP','PSD','PPP']
              assert data['key']['S']=='minecraft:slime_ball'
              assert data['key']['D']==f'minecraft:{color}_dye'
              assert data['result']['id']==f'cardboardstealth:{name}'
              re=json.loads((ns/'data/cardboardstealth/recipe'/f'recolor_{name}.json').read_text())
              assert re['type']==f'cardboardstealth:recolor_{color}'
              model=json.loads((ns/'assets/cardboardstealth/models/item'/f'{name}.json').read_text())
              assert model['loader']=='neoforge:separate_transforms'
              assert model['gui_light']=='front'
              assert model['base']['textures']['layer0']==f'cardboardstealth:item/colored/{name}'
              for perspective in ('firstperson_righthand','firstperson_lefthand',
                                  'thirdperson_righthand','thirdperson_lefthand','ground'):
                  assert model['perspectives'][perspective]['parent']==f'cardboardstealth:item/mini/{name}'
          for name in ['cardboard_box','box_dye_base','box_dye_details']:
              assert (ns/'assets/cardboardstealth/textures/item'/f'{name}.png').is_file()
          for name in ['paper','tape','recycle_logo']:
              assert (ns/'assets/cardboardstealth/textures/entity'/f'{name}.png').is_file()
          for name in ('cardboard_box','delivery_box','supply_box'):
              model=json.loads((ns/'assets/cardboardstealth/models/item'/f'{name}.json').read_text())
              assert model['loader']=='neoforge:separate_transforms'
              assert model['base']['textures']['layer0']==f'cardboardstealth:item/{name}'
          miniature=json.loads((ns/'assets/cardboardstealth/models/item/mini_cardboard_base.json').read_text())
          assert miniature['gui_light']=='side'
          assert len(miniature['elements'])>=27
          assert miniature['textures']['tape']=='cardboardstealth:item/mini/packing_tape'
          assert miniature['textures']['mark']=='cardboardstealth:item/mini/recycle_stamp'
          for view in ('firstperson_righthand','firstperson_lefthand',
                       'thirdperson_righthand','thirdperson_lefthand'):
              assert abs(miniature['display'][view]['rotation'][1])>=150
              assert miniature['display'][view]['scale'][0]<0.7
          assert abs(miniature['display']['ground']['rotation'][1])<25
          parts={e['name']:e for e in miniature['elements']}
          assert parts['top_tape']['to'][2]>=parts['rear_tape_fold']['from'][2]
          assert parts['top_tape']['from'][2]<=parts['front_tape_fold']['to'][2]
          assert len([p for p in parts if 'corrugated_edge' in p])==4
          assert 'tape_seal_left_raised_edge' in parts and 'tape_seal_right_raised_edge' in parts
          assert any(e.get('name')=='recycle_symbol' for e in miniature['elements'])
          assert any(e.get('name')=='eye_shadow' for e in miniature['elements'])
          for recipe in ('decal_apply_sticker','decal_peel_slime'):
              data=json.loads((ns/'data/cardboardstealth/recipe'/f'{recipe}.json').read_text())
              assert data['type']==f'cardboardstealth:{recipe}'
          for color in 'white light_gray gray black red orange yellow lime pink brown green cyan blue purple magenta light_blue'.split():
              assert not (ns/'data/cardboardstealth/recipe'/f'decal_{color}_carpet.json').exists(), 'old random carpet recipe survived'
          assert Path('src/main/java/tw/zonezero/cardboardstealth/DecalStickerItem.java').is_file()
          assert 'output.accept(ModItems.BLANK_STICKER.get())' in Path('src/main/java/tw/zonezero/cardboardstealth/ModCreativeTabs.java').read_text()
          print('PASS: restored box art, old carpet recipes fully retired, fixed-pattern sticker recipe registered')
          PY
      - name: Verify ordered sixteen-carpet decal rendering paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          r=Path('src/main/java/tw/zonezero/cardboardstealth')
          art=(r/'client/CardboardDecalRenderer.java').read_text()
          gui=(r/'client/ClientInit.java').read_text()
          stack=(r/'DecalStackRules.java').read_text()
          recipes=(r/'ModRecipes.java').read_text()
          assert 'LIGHT_GRAY_ATLAS' in art and 'GRAY_ATLAS' in art and 'BLACK_ATLAS' in art and 'RED_ATLAS' in art and 'ORANGE_ATLAS' in art and 'YELLOW_ATLAS' in art and 'LIME_ATLAS' in art and 'PINK_ATLAS' in art and 'BROWN_ATLAS' in art and 'GREEN_ATLAS' in art and 'CYAN_ATLAS' in art and 'BLUE_ATLAS' in art and 'PURPLE_ATLAS' in art and 'MAGENTA_ATLAS' in art and 'LIGHT_BLUE_ATLAS' in art
          assert 'getBuffer(RenderType.entityCutoutNoCull(atlas))' in art
          assert '0.16F + layer * 0.035F' in art
          assert 'ResourceLocation atlas = CardboardDecalRenderer.atlasFor' in gui
          assert '"light_gray_"' in gui and '"gray_"' in gui and '"black_"' in gui and '"red_"' in gui and '"orange_"' in gui and '"yellow_"' in gui and '"lime_"' in gui and '"pink_"' in gui and '"brown_"' in gui and '"green_"' in gui and '"cyan_"' in gui and '"blue_"' in gui and '"purple_"' in gui and '"magenta_"' in gui and '"light_blue_"' in gui
          assert '"tooltip.cardboardstealth."' in gui
          assert 'decal_apply_sticker' in recipes
          assert 'decal_peel_slime' in recipes
          assert 'decal_white_carpet' not in recipes
          assert 'DecalStickerItem' in (r/'ModItems.java').read_text()
          assert 'STICKERS' in (r/'ModItems.java').read_text()
          assert 'supportedColor(color(value))' in stack
          craft=(r/'DecalCraftingRecipe.java').read_text()
          assert 'instanceof DecalStickerItem' in craft
          assert 'DecalItemData.addSticker' in craft
          assert 'DecalStackRules.ANCHORS' in craft
          assert 'Items.SLIME_BALL' in craft
          assert 'Items.WHITE_CARPET' not in craft
          assert 'DecalStackRules.nextArt(' not in craft
          data=(r/'DecalItemData.java').read_text()
          assert 'addSticker(' in data
          assert 'DecalStackRules.pack(color,artwork,anchor)' in data
          assert 'addCarpet(' not in data
          mini=(r/'client/CardboardLayer.java').read_text()
          assert 'CardboardDecalRenderer.render(' in mini
          assert "CardboardDecalRenderer.render(" not in (r/'client/BoxViewOverlay.java').read_text()
          print('PASS: 16-color rendering and fixed artwork-sticker crafting code checks')
          PY
      - name: Validate assets and Curios data JSON
        run: |
          find src/main/resources -name '*.json' -print0 | xargs -0 -n1 python3 -m json.tool > /dev/null
          test -f src/main/resources/data/cardboardstealth/curios/slots/cardboard.json
          test -f src/main/resources/data/cardboardstealth/curios/entities/players.json
          test -f src/main/resources/data/curios/tags/item/cardboard.json
      - run: gradle --no-daemon build --stacktrace
      - name: Verify real 96 chosen-design sticker recipes, icons and names in packaged JAR
        run: |
          python3 - <<'PY'
          import glob,hashlib,json,struct,zipfile
          from pathlib import Path
          path=glob.glob('build/libs/cardboardstealth-neoforge-*.jar')[0]
          colors='white light_gray gray black red orange yellow lime pink brown green cyan blue purple magenta light_blue'.split()
          lang=json.loads(Path('src/main/resources/assets/cardboardstealth/lang/zh_tw.json').read_text())
          en=json.loads(Path('src/main/resources/assets/cardboardstealth/lang/en_us.json').read_text())
          assert len(colors)==16
          with zipfile.ZipFile(path) as z:
              read=lambda path: json.loads(z.read(path))
              blank=read('data/cardboardstealth/recipe/blank_sticker.json')
              assert blank['type']=='minecraft:crafting_shapeless'
              assert blank['ingredients']==['minecraft:paper','minecraft:slime_ball']
              assert blank['result']['id']=='cardboardstealth:blank_sticker'
              assert read('data/cardboardstealth/recipe/decal_apply_sticker.json')['type']=='cardboardstealth:decal_apply_sticker'
              thumbs=set()
              for color in colors:
                  assert f'data/cardboardstealth/recipe/decal_{color}_carpet.json' not in z.namelist()
                  for num in range(1,7):
                      id=f'sticker_{color}_{num}'
                      recipe=read(f'data/cardboardstealth/recipe/{id}.json')
                      assert recipe['type']=='minecraft:crafting_shapeless',id
                      assert recipe['ingredients']==['cardboardstealth:blank_sticker']+['minecraft:'+color+'_dye']*num,id
                      assert recipe['result']=={'id':'cardboardstealth:'+id,'count':1},id
                      model=read(f'assets/cardboardstealth/models/item/{id}.json')
                      assert model['textures']['layer0']=='cardboardstealth:item/stickers/'+id,id
                      png=z.read(f'assets/cardboardstealth/textures/item/stickers/{id}.png')
                      assert png[:8]==bytes.fromhex('89504e470d0a1a0a')
                      assert struct.unpack_from('>II',png,16)==(64,64),id
                      thumbs.add(hashlib.sha256(png).hexdigest())
                      assert lang[f'item.cardboardstealth.{id}'].find('圖樣貼紙')!=-1,id
                      assert lang[f'item.cardboardstealth.sticker_subject_{color}_{num}'],id
                      assert en[f'item.cardboardstealth.{id}'],id
              assert len(thumbs)==96,'96 individual image icons must have distinct pixel contents'
              assert 'assets/cardboardstealth/textures/item/stickers/blank_sticker.png' in z.namelist()
              assert read('assets/cardboardstealth/models/item/blank_sticker.json')['textures']['layer0']=='cardboardstealth:item/stickers/blank_sticker'
              assert 'data/cardboardstealth/recipe/decal_peel_slime.json' in z.namelist()
          print('PASS: one blank recipe, 96 exact dye-count recipes, 96 unique real-art icons, 96 localized subjects, no carpet lottery')
          PY
      - name: Validate high-detail printable machine model, art and survival resources in JAR
        run: |
          python3 - <<'PY'
          import glob,json,struct,zipfile
          jar=glob.glob('build/libs/cardboardstealth-neoforge-*.jar')[0]
          with zipfile.ZipFile(jar) as z:
              root='assets/cardboardstealth/'
              read=lambda path: json.loads(z.read(path))
              block=read(root+'models/block/sticker_printer.json')
              assert block['parent']=='minecraft:block/block'
              assert len(block['elements'])>=35,'Expected raised 3D parts, not a single flat cube'
              names=[e['name'] for e in block['elements']]
              for part in ('rear_paper_input_feeder','inserted_blank_paper','paper_exit_dark_slot',
                           'output_tray_flat','printed_sticker_on_tray','left_cyan_ink_cartridge',
                           'left_orange_ink_cartridge','illuminated_design_screen',
                           'right_side_service_vent','corner_steel_bolt_fl'):
                  assert part in names,'3D machine part absent: '+part
              states=read(root+'blockstates/sticker_printer.json')['variants']
              for d in ('north','south','east','west'):
                  assert 'facing='+d in states
              assert read(root+'models/item/sticker_printer.json')['parent']=='cardboardstealth:block/sticker_printer'
              for name in ('metal','dark','steel','panel','screen','paper',
                           'teal','orange','vent','warning'):
                  p=root+'textures/block/printer_'+name+'.png'
                  raw=z.read(p)
                  assert raw[:8]==bytes.fromhex('89504e470d0a1a0a')
                  assert struct.unpack_from('>II',raw,16)==(64,64),p
              recipe=read('data/cardboardstealth/recipe/sticker_printer.json')
              assert recipe['type']=='minecraft:crafting_shaped'
              assert recipe['pattern']==['IGI','RPR','IHI']
              assert recipe['result']['id']=='cardboardstealth:sticker_printer'
              loot=read('data/cardboardstealth/loot_table/blocks/sticker_printer.json')
              assert loot['type']=='minecraft:block'
              assert 'cardboardstealth:sticker_printer' in str(loot)
              assert 'cardboardstealth:sticker_printer' in read(
                  'data/minecraft/tags/block/mineable/pickaxe.json')['values']
              assert 'block.cardboardstealth.sticker_printer' in read(
                  root+'lang/zh_tw.json')
          print('PASS: 35+ independent 3D parts, ten 64px material atlases, all facings, survival crafting and drops')
          PY
      - name: Check generated Minecraft box textures are in the final JAR
        run: |
          python3 - <<'PY'
          import glob, struct, zipfile
          jar=glob.glob('build/libs/*.jar')
          assert len(jar)==1, f'Expected one mod jar: {jar}'
          with zipfile.ZipFile(jar[0]) as z:
              for name in ('paper_refined.png','tape_refined.png','recycle_stamp.png'):
                  p='assets/cardboardstealth/textures/entity/'+name
                  raw=z.read(p)
                  assert raw[:8] == bytes.fromhex('89504e470d0a1a0a'), p
                  assert struct.unpack_from('>II',raw,16)==(128,128), p
              print('PASS: 3/3 128px model-art texture atlases packed into JAR')
              import hashlib
              unique=set()
              for color in 'white orange magenta light_blue yellow lime pink gray light_gray cyan purple blue brown green red black'.split():
                  p=f'assets/cardboardstealth/textures/item/colored/{color}_cardboard_box.png'
                  png=z.read(p)
                  assert png[:8]==bytes.fromhex('89504e470d0a1a0a'),p
                  assert struct.unpack_from('>II',png,16)==(64,64),p
                  unique.add(hashlib.sha256(png).hexdigest())
              assert len(unique)==16, 'Some dyed sprites are identical'
              print('PASS: 16/16 distinct 64px dyed box item icons packed into JAR')
          PY
