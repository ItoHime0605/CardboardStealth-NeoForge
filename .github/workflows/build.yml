              for image in ('packing_tape','recycle_stamp'):
                  assert root+'textures/item/mini/'+image+'.png' in z.namelist()
              colors='white orange magenta light_blue yellow lime pink gray light_gray cyan purple blue brown green red black'.split()
              for name in ('cardboard_box','delivery_box','supply_box')+tuple(c+'_cardboard_box' for c in colors):
                  model=json.loads(z.read(root+'models/item/'+name+'.json'))
                  old=(root+'textures/item/'+(f'colored/{name}' if name not in ('cardboard_box','delivery_box','supply_box') else name)+'.png')
                  assert old in z.namelist(), 'missing original old GUI PNG: '+name
                  expected='cardboardstealth:item/'+(f'colored/{name}' if name not in ('cardboard_box','delivery_box','supply_box') else name)
                  assert model['base']['textures']['layer0']==expected, name
                  for perspective in ('firstperson_righthand','thirdperson_righthand','ground'):
                      assert model['perspectives'][perspective]['parent']=='cardboardstealth:item/mini/'+name
          print('PASS: all 19 original GUI routes and 3D item-atlas materials are genuinely inside the built JAR')
          PY
