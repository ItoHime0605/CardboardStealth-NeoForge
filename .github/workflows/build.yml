name: Build cardboardstealth 1.21.1
on:
  workflow_dispatch:
  push:
    branches: [main, 'development/**']
concurrency:
  group: cardboardstealth-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Check detection rules
        run: |
          mkdir -p build/rule-tests
          javac -encoding UTF-8 -d build/rule-tests src/main/java/tw/zonezero/cardboardstealth/BoxDetectionRules.java tests/BoxDetectionRulesTest.java
          java -cp build/rule-tests BoxDetectionRulesTest
      - name: Check sound classification
        run: |
          javac -encoding UTF-8 -d build/rule-tests src/main/java/tw/zonezero/cardboardstealth/BoxSoundRules.java tests/BoxSoundRulesTest.java
          java -cp build/rule-tests BoxSoundRulesTest
      - name: Check disguise activation
        run: |
          javac -encoding UTF-8 -d build/rule-tests src/main/java/tw/zonezero/cardboardstealth/BoxActivationRules.java tests/BoxActivationRulesTest.java
          java -cp build/rule-tests BoxActivationRulesTest
      - name: Check handgun and suppressor policy
        run: |
          javac -encoding UTF-8 -d build/rule-tests src/main/java/tw/zonezero/cardboardstealth/BoxPolicy.java tests/BoxPolicyTest.java
          java -cp build/rule-tests BoxPolicyTest
      - name: Check cardboard eye-window geometry
        run: |
          javac -encoding UTF-8 -d build/rule-tests src/main/java/tw/zonezero/cardboardstealth/BoxViewGeometry.java tests/BoxViewGeometryTest.java
          java -cp build/rule-tests BoxViewGeometryTest
      - name: Check third-person visual concealment
        run: |
          javac -encoding UTF-8 -d build/rule-tests src/main/java/tw/zonezero/cardboardstealth/BoxRenderRules.java tests/BoxRenderRulesTest.java
          java -cp build/rule-tests BoxRenderRulesTest
      - name: Confirm crash-causing client Mixins are not registered
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          mixins=json.loads(Path("src/main/resources/cardboardstealth.mixins.json").read_text())
          assert not mixins.get('client',[]), "No client render Mixins may be registered"
          code=Path("src/main/java/tw/zonezero/cardboardstealth/client/ClientInit.java").read_text()
          assert "ClientLayerRenderControl.before(event.getRenderer())" in code
          assert "ClientLayerRenderControl.after(event.getRenderer())" in code
          assert not Path("src/main/java/tw/zonezero/cardboardstealth/mixin/ClientLayerFilterMixin.java").exists()
          assert not Path("src/main/java/tw/zonezero/cardboardstealth/mixin/ClientItemInHandMixin.java").exists()
          print("PASS: 5/5 client render startup-regression checks")
          PY
      - name: Test temporary third-person layer filtering and restoration
        run: |
          javac -encoding UTF-8 -d build/rule-tests src/main/java/tw/zonezero/cardboardstealth/BoxLayerMasking.java tests/BoxLayerMaskingTest.java
          java -cp build/rule-tests BoxLayerMaskingTest
      - name: Check five-tick cardboard settling
        run: |
          javac -encoding UTF-8 -d build/rule-tests src/main/java/tw/zonezero/cardboardstealth/BoxMotionRules.java tests/BoxMotionRulesTest.java
          java -cp build/rule-tests BoxMotionRulesTest
      - name: Test 3-layer decal stack, newest-first peeling and color preservation
        run: |
          javac -encoding UTF-8 -d build/rule-tests src/main/java/tw/zonezero/cardboardstealth/DecalStackRules.java tests/DecalStackRulesTest.java
          java -cp build/rule-tests DecalStackRulesTest
      - name: Check 16 dye colors and model movement
        run: |
          javac -encoding UTF-8 -d build/rule-tests src/main/java/tw/zonezero/cardboardstealth/BoxColors.java src/main/java/tw/zonezero/cardboardstealth/BoxModelPose.java tests/BoxColorsAndPoseTest.java
          java -cp build/rule-tests BoxColorsAndPoseTest
      - name: Check tinted interior cardboard appearance
        run: |
          javac -encoding UTF-8 -d build/rule-tests src/main/java/tw/zonezero/cardboardstealth/BoxColors.java src/main/java/tw/zonezero/cardboardstealth/BoxInteriorPalette.java tests/BoxInteriorPaletteTest.java
          java -cp build/rule-tests BoxInteriorPaletteTest
      - name: Check exterior eye slot vs larger player-view mask
        run: |
          javac -encoding UTF-8 -d build/rule-tests src/main/java/tw/zonezero/cardboardstealth/BoxModelGeometry.java src/main/java/tw/zonezero/cardboardstealth/BoxModelPose.java src/main/java/tw/zonezero/cardboardstealth/BoxViewGeometry.java tests/BoxModelGeometryTest.java
          java -cp build/rule-tests BoxModelGeometryTest
      - name: Verify the dark under-mouth belongs to the body, not the flaps
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/main/java/tw/zonezero/cardboardstealth/client/CardboardLayer.java").read_text()
          assert 'root.addOrReplaceChild("underside_shade"' in p
          assert 'undersideShade.render(' in p
          assert 'BoxModelGeometry.UNDERMOUTH_DARK_ARGB' in p
          assert 'folded.addOrReplaceChild("front_flap"' in p
          print('PASS: 4/4 bottom shadow panel integration checks')
          PY
      - name: Validate full visual worklist source integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('src/main/java/tw/zonezero/cardboardstealth')
          render=(root/'client/CardboardLayer.java').read_text()
          overlay=(root/'client/BoxViewOverlay.java').read_text()
          props=(root/'BoxModelPose.java').read_text()
          tabs=(root/'ModCreativeTabs.java').read_text()
          entry=(root/'CardboardStealth.java').read_text()
          assert 'flapAngle(resting)' in render and 'liftPixels(resting)' in render
          assert 'lookRelativeYaw(bodyYaw, headYaw)' in render
          assert 'stepBackTilt' not in render and 'stepBackTilt' not in props
          assert 'eye_cavity' in render and 'inner_lip_above' in render
          assert 'renderFaceBehindSlit(player, pose, buffers, light)' in render
          assert 'inside_recess' not in render and 'head_shadow' not in render
          assert 'renderBackRecyclingStamp' in render and 'REAR_STAMP_LEFT_X' in render
          assert 'innerBase(variant)' in overlay and 'BoxViewGeometry.calculate' in overlay
          assert 'ModCreativeTabs.TABS.register(modBus)' in entry
          assert 'itemGroup.cardboardstealth' in tabs
          print('PASS: 8/8 integrated full-worklist source checks')
          PY
      - name: Verify recipes and model assets
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          ns=Path('src/main/resources')
          colors='white orange magenta light_blue yellow lime pink gray light_gray cyan purple blue brown green red black'.split()
          for color in colors:
              name=f'{color}_cardboard_box'
              data=json.loads((ns/'data/cardboardstealth/recipe'/f'craft_{name}.json').read_text())
              assert data['pattern']==['PPP','PSD','PPP']
              assert data['key']['S']=='minecraft:slime_ball'
              assert data['key']['D']==f'minecraft:{color}_dye'
              assert data['result']['id']==f'cardboardstealth:{name}'
              re=json.loads((ns/'data/cardboardstealth/recipe'/f'recolor_{name}.json').read_text())
              assert re['type']==f'cardboardstealth:recolor_{color}'
              model=json.loads((ns/'assets/cardboardstealth/models/item'/f'{name}.json').read_text())
              assert model['loader']=='neoforge:separate_transforms'
              assert model['gui_light']=='front'
              assert model['base']['textures']['layer0']==f'cardboardstealth:item/straight/{name}'
              for perspective in ('firstperson_righthand','firstperson_lefthand',
                                  'thirdperson_righthand','thirdperson_lefthand','ground'):
                  assert model['perspectives'][perspective]['parent']==f'cardboardstealth:item/mini/{name}'
          for name in ['cardboard_box','box_dye_base','box_dye_details']:
              assert (ns/'assets/cardboardstealth/textures/item'/f'{name}.png').is_file()
          for name in ['paper','tape','recycle_logo']:
              assert (ns/'assets/cardboardstealth/textures/entity'/f'{name}.png').is_file()
          for name in ('cardboard_box','delivery_box','supply_box'):
              model=json.loads((ns/'assets/cardboardstealth/models/item'/f'{name}.json').read_text())
              assert model['loader']=='neoforge:separate_transforms'
              assert model['base']['textures']['layer0']==f'cardboardstealth:item/straight/{name}'
          miniature=json.loads((ns/'assets/cardboardstealth/models/item/mini_cardboard_base.json').read_text())
          assert miniature['gui_light']=='side'
          assert len(miniature['elements'])>=15
          assert any(e.get('name')=='recycle_symbol' for e in miniature['elements'])
          assert any(e.get('name')=='eye_shadow' for e in miniature['elements'])
          for recipe in ('decal_white_carpet','decal_light_gray_carpet','decal_gray_carpet','decal_black_carpet','decal_peel_slime'):
              data=json.loads((ns/'data/cardboardstealth/recipe'/f'{recipe}.json').read_text())
              assert data['type']==f'cardboardstealth:{recipe}'
          print('PASS: 19 2D/3D split item models, 16 dyes, 16 recolor serializers and five decal crafting recipes')
          PY
      - name: Verify ordered four-carpet decal rendering paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          r=Path('src/main/java/tw/zonezero/cardboardstealth')
          art=(r/'client/CardboardDecalRenderer.java').read_text()
          gui=(r/'client/ClientInit.java').read_text()
          stack=(r/'DecalStackRules.java').read_text()
          recipes=(r/'ModRecipes.java').read_text()
          assert 'LIGHT_GRAY_ATLAS' in art and 'GRAY_ATLAS' in art and 'BLACK_ATLAS' in art
          assert 'getBuffer(RenderType.entityCutoutNoCull(atlas))' in art
          assert '0.16F + layer * 0.035F' in art
          assert 'ResourceLocation atlas = CardboardDecalRenderer.atlasFor' in gui
          assert '"light_gray_"' in gui and '"gray_"' in gui and '"black_"' in gui
          assert '"tooltip.cardboardstealth."' in gui
          assert 'DecalStackRules.LIGHT_GRAY' in recipes
          assert 'DecalStackRules.GRAY' in recipes
          assert 'DecalStackRules.BLACK' in recipes
          assert 'supportedColor(color(value))' in stack
          craft=(r/'DecalCraftingRecipe.java').read_text()
          assert 'case DecalStackRules.LIGHT_GRAY ->' in craft
          assert 'case DecalStackRules.GRAY ->' in craft
          assert 'case DecalStackRules.BLACK ->' in craft
          mini=(r/'client/CardboardLayer.java').read_text()
          assert 'CardboardDecalRenderer.render(' in mini
          assert "CardboardDecalRenderer.render(" not in (r/'client/BoxViewOverlay.java').read_text()
          print('PASS: 14/14 four-family sticker, ordered layering, GUI and recipe checks')
          PY
      - name: Validate assets and Curios data JSON
        run: |
          find src/main/resources -name '*.json' -print0 | xargs -0 -n1 python3 -m json.tool > /dev/null
          test -f src/main/resources/data/cardboardstealth/curios/slots/cardboard.json
          test -f src/main/resources/data/cardboardstealth/curios/entities/players.json
          test -f src/main/resources/data/curios/tags/item/cardboard.json
      - run: gradle --no-daemon build --stacktrace
      - name: Check generated Minecraft box textures are in the final JAR
        run: |
          python3 - <<'PY'
          import glob, struct, zipfile
          jar=glob.glob('build/libs/*.jar')
          assert len(jar)==1, f'Expected one mod jar: {jar}'
          with zipfile.ZipFile(jar[0]) as z:
              for name in ('paper_refined.png','tape_refined.png','recycle_stamp.png'):
                  p='assets/cardboardstealth/textures/entity/'+name
                  raw=z.read(p)
                  assert raw[:8] == bytes.fromhex('89504e470d0a1a0a'), p
                  assert struct.unpack_from('>II',raw,16)==(128,128), p
              print('PASS: 3/3 128px model-art texture atlases packed into JAR')
              import hashlib
              unique=set()
              for color in 'white orange magenta light_blue yellow lime pink gray light_gray cyan purple blue brown green red black'.split():
                  p=f'assets/cardboardstealth/textures/item/colored/{color}_cardboard_box.png'
                  png=z.read(p)
                  assert png[:8]==bytes.fromhex('89504e470d0a1a0a'),p
                  assert struct.unpack_from('>II',png,16)==(64,64),p
                  unique.add(hashlib.sha256(png).hexdigest())
              assert len(unique)==16, 'Some dyed sprites are identical'
              print('PASS: 16/16 distinct 64px dyed box item icons packed into JAR')
          PY
      - name: Validate all 24 original white/light-gray/gray/black carpet art sprites in JAR
        run: |
          javac -encoding UTF-8 -d build/rule-tests tests/DecalArtworkTest.java
          java -cp build/rule-tests DecalArtworkTest "$(find build/libs -maxdepth 1 -name 'cardboardstealth-neoforge-*.jar' -print -quit)"
      - name: Validate black hip-hop art has recognizable contrasting ink and transparent distress
        run: |
          javac -encoding UTF-8 -d build/rule-tests tests/BlackDecalArtTest.java
          java -cp build/rule-tests BlackDecalArtTest "$(find build/libs -maxdepth 1 -name 'cardboardstealth-neoforge-*.jar' -print -quit)"
      - name: Decode final JAR pixels to verify real dyed icons and recycling mark
        run: |
          javac -encoding UTF-8 -d build/rule-tests tests/CardboardAssetIntegrityTest.java
          java -cp build/rule-tests CardboardAssetIntegrityTest "$(find build/libs -maxdepth 1 -name 'cardboardstealth-neoforge-*.jar' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: cardboardstealth-neoforge-1.21.1-0.1.26-alpha
          path: build/libs/*.jar
