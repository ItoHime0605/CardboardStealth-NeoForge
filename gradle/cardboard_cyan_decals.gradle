import java.awt.image.BufferedImage
import java.awt.Color
import java.awt.Font
import java.awt.BasicStroke
import java.awt.Polygon
import java.awt.AlphaComposite
import java.awt.RenderingHints
import javax.imageio.ImageIO

/**
 * Carpet family #12 CYAN: six individual post-collapse meteorological
 * observatory diagrams. No reused poster scene, external image or font asset.
 * Deterministic Java2D output: six 128x80 transparent PNGs and 256x240 atlas.
 *
 * 0 storm radar map, 1 rain collector, 2 cup anemometer,
 * 3 weather balloon, 4 barometer, 5 broken satellite ground station.
 */
def cyanDecalOutput=layout.buildDirectory.dir('generated/cardboard-cyan-decals')
tasks.register('generateCyanCardboardDecals') {
    inputs.property('cyan-weather-original-art-revision','2026-11-06-six-weather-observations-v1')
    outputs.dir(cyanDecalOutput)
    doLast {
        File dir=new File(cyanDecalOutput.get().asFile,
                'assets/cardboardstealth/textures/decals')
        dir.mkdirs()
        final int W=128,H=80
        final Color CYAN=new Color(86,191,204)
        final Color ICE=new Color(168,227,224)
        final Color PALE=new Color(228,239,212)
        final Color NIGHT=new Color(38,65,76)
        final Color BLUE=new Color(57,111,139)
        final Color SEA=new Color(73,155,160)
        final Color RUST=new Color(159,83,65)
        final Color GLOW=new Color(234,184,92)
        final Color CHARCOAL=new Color(49,56,60)
        final Color DUST=new Color(171,194,177)
        final String[][] LABELS=[
            ['STORM','RADAR','ECHO 09'],
            ['RAIN','GAUGE','24H OBS'],
            ['WIND','CHECK','GUST 70'],
            ['SKY','PROBE','BALLOON'],
            ['PRESS','DROP','BARO 03'],
            ['LOST','LINK','SAT-12']
        ] as String[][]
        BufferedImage atlas=new BufferedImage(256,240,BufferedImage.TYPE_INT_ARGB)
        for(int id=0;id<6;id++) {
            java.util.Random rng=new java.util.Random(203407L+14669L*id)
            BufferedImage img=new BufferedImage(W,H,BufferedImage.TYPE_INT_ARGB)
            def g=img.createGraphics()
            g.setRenderingHint(RenderingHints.KEY_ANTIALIASING,RenderingHints.VALUE_ANTIALIAS_OFF)
            g.setRenderingHint(RenderingHints.KEY_TEXT_ANTIALIASING,RenderingHints.VALUE_TEXT_ANTIALIAS_OFF)
            g.setRenderingHint(RenderingHints.KEY_FRACTIONALMETRICS,RenderingHints.VALUE_FRACTIONALMETRICS_OFF)
            Polygon torn=new Polygon()
            for(int x=4;x<=123;x+=7) torn.addPoint(x,4+rng.nextInt(7))
            torn.addPoint(124,18);torn.addPoint(121,31);torn.addPoint(125,47)
            torn.addPoint(123,64)
            for(int x=118;x>=6;x-=7) torn.addPoint(x,70+rng.nextInt(6))
            torn.addPoint(4,63);torn.addPoint(6,47);torn.addPoint(3,28)
            g.setColor(id%2==0?new Color(181,209,198):new Color(189,211,200))
            g.fillPolygon(torn)
            g.setClip(torn)
            // Retrofuturist field-chart border; faded offset ink registration.
            g.setColor(NIGHT);g.fillRect(6,10,116,4)
            g.fillRect(6,68,116,4)
            g.setColor(CYAN);g.fillRect(7,14,114,3)
            g.setColor(PALE);g.fillRect(8,18,55,47)
            g.setColor(BLUE);g.fillRect(65,18,2,47)
            g.setColor(DUST)
            for(int y=21;y<65;y+=8)g.drawLine(8,y,63,y)
            for(int x=11;x<64;x+=9)g.drawLine(x,19,x,65)
            // Distressed silkscreen flecks. Draw the icon over these marks.
            for(int j=0;j<850;j++){
                int x=6+rng.nextInt(117),y=9+rng.nextInt(64)
                int a=6+rng.nextInt(54)
                g.setColor(j%4==0?new Color(30,61,75,a):
                           j%4==1?new Color(241,240,209,a):
                           j%4==2?new Color(70,165,178,a):
                           new Color(170,91,64,a))
                g.fillRect(x,y,1+(j%13==0?2:0),1)
            }
            switch(id){
                case 0: { // Scientific radar monitor, sweeping sector, storm cell.
                    g.setColor(NIGHT);g.fillRoundRect(13,20,48,42,4,4)
                    g.setColor(BLUE);g.fillOval(19,22,35,35)
                    g.setColor(ICE);g.setStroke(new BasicStroke(1F))
                    g.drawOval(24,27,25,25);g.drawOval(30,33,13,13)
                    g.drawLine(36,24,36,56);g.drawLine(20,39,54,39)
                    g.setColor(CYAN);g.fillArc(20,23,33,33,306,41)
                    g.setColor(GLOW);g.fillOval(40,28,7,7)
                    g.setColor(RUST);g.fillRect(15,56,40,3)
                    g.setColor(PALE);g.fillRect(23,59,20,2)
                    break
                }
                case 1: { // Open rain gauge and scale with measured precipitation.
                    g.setColor(NIGHT)
                    g.fillRect(22,20,28,4);g.fillRect(26,24,20,35)
                    g.setColor(PALE);g.fillRect(30,26,12,29)
                    g.setColor(CYAN);g.fillRect(30,39,12,16)
                    g.setColor(BLUE)
                    for(int y=29;y<53;y+=4)g.fillRect(34,y,9,1)
                    g.setColor(SEA);g.fillPolygon([23,35,39,49] as int[],
                        [20,12,12,20] as int[],4)
                    g.setColor(NIGHT);g.fillRect(17,59,39,5)
                    g.setColor(ICE)
                    for(int j=0;j<7;j++){
                        int x=12+j*7
                        g.fillRect(x,24+(j%3)*5,2,5)
                    }
                    g.setColor(RUST);g.fillRect(51,27,4,14)
                    break
                }
                case 2: { // Rotating cup anemometer on mast, four clear cups.
                    g.setColor(NIGHT);g.setStroke(new BasicStroke(3F))
                    g.drawLine(37,36,37,64);g.drawLine(21,64,53,64)
                    g.setStroke(new BasicStroke(1F))
                    g.setColor(BLUE);g.fillOval(30,29,14,14)
                    g.setColor(NIGHT);g.fillRect(18,34,42,3)
                    g.fillRect(35,19,4,37)
                    g.setColor(CYAN)
                    g.fillArc(6,28,18,16,80,210)
                    g.fillArc(52,28,18,16,260,210)
                    g.setColor(SEA);g.fillArc(28,13,18,14,170,210)
                    g.fillArc(29,44,18,14,350,210)
                    g.setColor(GLOW);g.fillOval(34,33,7,7)
                    g.setColor(RUST);g.fillRect(47,55,11,2)
                    break
                }
                case 3: { // Tethered upper-atmosphere balloon and sensor package.
                    g.setColor(ICE);g.fillOval(17,15,40,34)
                    g.setColor(SEA);g.fillOval(23,18,26,28)
                    g.setColor(CYAN);g.fillOval(30,20,12,25)
                    g.setColor(PALE);g.fillOval(25,20,6,10)
                    g.setColor(NIGHT)
                    g.fillPolygon([28,47,45] as int[],[46,53,46] as int[],3)
                    g.setStroke(new BasicStroke(2F))
                    g.drawLine(28,48,29,58);g.drawLine(45,48,44,58)
                    g.setStroke(new BasicStroke(1F))
                    g.setColor(RUST);g.fillRect(26,58,22,8)
                    g.setColor(NIGHT);g.drawRect(26,57,22,8)
                    g.setColor(PALE);g.fillRect(33,60,8,3)
                    g.setColor(GLOW);g.fillRect(52,52,5,5)
                    break
                }
                case 4: { // Analog barometer, two needles, and pressure graph.
                    g.setColor(NIGHT);g.fillOval(11,18,49,46)
                    g.setColor(ICE);g.fillOval(15,22,41,38)
                    g.setColor(BLUE);g.fillOval(18,25,35,32)
                    g.setColor(PALE);g.drawOval(21,27,29,27)
                    g.setColor(GLOW);g.setStroke(new BasicStroke(3F))
                    g.drawLine(35,41,46,28)
                    g.setStroke(new BasicStroke(1F))
                    g.setColor(CYAN);g.drawLine(35,41,25,47)
                    g.setColor(NIGHT);g.fillOval(32,38,7,7)
                    g.setColor(RUST);g.fillRect(18,58,34,4)
                    g.setColor(PALE)
                    for(int i=0;i<5;i++)g.fillRect(21+i*7,57,2,3)
                    break
                }
                case 5: { // Collapsed satellite antenna, broken cable, dish.
                    g.setColor(NIGHT);g.setStroke(new BasicStroke(3F))
                    g.drawLine(37,41,37,64);g.drawLine(17,64,58,64)
                    g.drawLine(38,43,49,30)
                    g.setStroke(new BasicStroke(1F))
                    g.setColor(BLUE);g.fillArc(11,13,49,39,193,152)
                    g.setColor(ICE);g.drawArc(14,16,42,32,195,152)
                    g.setColor(NIGHT);g.fillOval(43,25,10,10)
                    g.setColor(GLOW);g.fillRect(47,21,4,7)
                    g.setColor(SEA);g.fillRect(21,53,16,6)
                    g.setColor(RUST)
                    g.setStroke(new BasicStroke(2F));g.drawLine(38,47,51,54)
                    g.setStroke(new BasicStroke(1F));g.drawLine(51,54,57,50)
                    g.setColor(CYAN);g.drawArc(47,16,21,15,25,90)
                    break
                }
            }
            // Each story is identifiable by both its icon and own text lines.
            g.setColor(NIGHT)
            g.setFont(new Font('SansSerif',Font.BOLD,15))
            g.drawString(LABELS[id][0],70,33)
            g.setColor(BLUE);g.setFont(new Font('SansSerif',Font.BOLD,12))
            g.drawString(LABELS[id][1],70,49)
            g.setColor(CYAN);g.fillRect(70,54,45,3)
            g.setColor(CHARCOAL);g.setFont(new Font('Monospaced',Font.BOLD,8))
            g.drawString(LABELS[id][2],70,65)
            // Final ink loss, including actual fully transparent pinholes.
            for(int j=0;j<168;j++){
                int x=6+rng.nextInt(115),y=7+rng.nextInt(67)
                g.setColor(j%3==0?new Color(245,242,210,71):
                           j%3==1?new Color(35,63,77,46):
                           new Color(159,93,65,58))
                g.fillRect(x,y,1+(j%19==0?2:0),1)
            }
            g.setComposite(AlphaComposite.Clear)
            for(int j=0;j<102;j++){
                int x=6+rng.nextInt(115),y=8+rng.nextInt(64)
                g.fillRect(x,y,j%18==0?3:1,1)
            }
            g.setComposite(AlphaComposite.SrcOver)
            g.setClip(null);g.dispose()
            ImageIO.write(img,'png',new File(dir,'cyan_'+id+'.png'))
            def output=atlas.createGraphics()
            output.drawImage(img,(id%2)*W,Math.floorDiv(id,2)*H,null)
            output.dispose()
        }
        ImageIO.write(atlas,'png',new File(dir,'cyan_atlas.png'))
        println 'Generated six original cyan weather observatory illustrations and 256x240 atlas.'
    }
}
tasks.named('processResources') {
    dependsOn tasks.named('generateCyanCardboardDecals')
    from(cyanDecalOutput)
}
