import java.awt.image.BufferedImage
import java.awt.Color
import java.awt.Font
import java.awt.BasicStroke
import java.awt.Polygon
import java.awt.AlphaComposite
import java.awt.RenderingHints
import javax.imageio.ImageIO

/**
 * Carpet #10, BROWN: six original, old woodcut-style wilderness-survival prints.
 * Each composition has a genuinely different illustrated object. The warm
 * paper, torn exterior, weathered ink, and engraved hatch shading are generated
 * in Java2D without external image sources, assets or bundled font files.
 */
def brownDecalOutput = layout.buildDirectory.dir('generated/cardboard-brown-decals')
tasks.register('generateBrownCardboardDecals') {
    inputs.property('brown-survival-print-revision','2026-11-06-six-original-survival-v1')
    outputs.dir(brownDecalOutput)
    doLast {
        File dir = new File(brownDecalOutput.get().asFile,
                'assets/cardboardstealth/textures/decals')
        dir.mkdirs()
        final int W=128,H=80
        final Color PAPER = new Color(216,179,126)
        final Color SAND = new Color(232,200,152)
        final Color INK = new Color(51,43,38)
        final Color UMBER = new Color(101,59,41)
        final Color RUST = new Color(170,91,55)
        final Color KHAKI = new Color(111,110,71)
        final Color SAGE = new Color(86,119,94)
        final Color GOLD = new Color(224,161,82)
        final Color DUSK = new Color(111,86,79)
        final Color[] BACKGROUND = [
            PAPER,new Color(225,197,159),new Color(216,186,138),
            new Color(222,188,148),new Color(207,170,124),
            new Color(230,191,142)
        ] as Color[]
        final String[][] WORDS = [
            ['BOIL','FIRST','FIELD STOVE'],
            ['REST','HERE','TARP CAMP'],
            ['CLEAN','WATER','FILTER KIT'],
            ['FIND','NORTH','TRAIL MAP'],
            ['KEEP','DRY','FIELD PACK'],
            ['HAUL','MORE','SCRAP CART']
        ] as String[][]
        BufferedImage atlas = new BufferedImage(256,240,BufferedImage.TYPE_INT_ARGB)
        for(int id=0;id<6;id++){
            java.util.Random rnd = new java.util.Random(6307221L+12011L*id)
            BufferedImage img = new BufferedImage(W,H,BufferedImage.TYPE_INT_ARGB)
            def g=img.createGraphics()
            g.setRenderingHint(RenderingHints.KEY_ANTIALIASING,RenderingHints.VALUE_ANTIALIAS_OFF)
            g.setRenderingHint(RenderingHints.KEY_TEXT_ANTIALIASING,RenderingHints.VALUE_TEXT_ANTIALIAS_OFF)
            g.setRenderingHint(RenderingHints.KEY_FRACTIONALMETRICS,RenderingHints.VALUE_FRACTIONALMETRICS_OFF)
            Polygon torn=new Polygon()
            for(int x=4;x<=123;x+=7)torn.addPoint(x,4+rnd.nextInt(6))
            torn.addPoint(122,17);torn.addPoint(125,32)
            torn.addPoint(121,48);torn.addPoint(124,62)
            for(int x=119;x>=5;x-=7)torn.addPoint(x,70+rnd.nextInt(6))
            torn.addPoint(4,61);torn.addPoint(7,45);torn.addPoint(3,26)
            g.setColor(BACKGROUND[id]);g.fillPolygon(torn)
            g.setClip(torn)
            // Distinct engraved wood-block poster frame and misregistered ink.
            g.setColor(UMBER);g.fillRect(6,9,116,4);g.fillRect(6,68,116,4)
            g.setColor(RUST);g.fillRect(8,13,109,2)
            g.setColor(KHAKI);g.fillRect(65,16,2,50)
            g.setColor(SAND);g.fillRect(9,16,53,50)
            g.setColor(id%2==0?KHAKI:DUSK)
            for(int stripe=0;stripe<8;stripe++) {
                int x=9+stripe*7
                g.drawLine(x,17,x-7,64)
            }
            // Old paper fibres and faded print mottling.
            for(int j=0;j<930;j++){
                int x=7+rnd.nextInt(114),y=10+rnd.nextInt(61)
                int alpha=8+rnd.nextInt(54)
                g.setColor(j%4==0?new Color(55,42,34,alpha):
                           j%4==1?new Color(255,235,189,alpha):
                           j%4==2?new Color(154,87,51,alpha):
                           new Color(114,125,83,alpha))
                g.fillRect(x,y,1+(j%13==0?2:0),1)
            }
            // Left-hand artwork: each central pictogram uses its own silhouette.
            switch(id){
                case 0: { // Field stove, battered metal pot, flame and rising steam.
                    g.setColor(INK);g.fillRoundRect(19,34,37,25,5,5)
                    g.setColor(SAND);g.fillRoundRect(22,38,31,16,3,3)
                    g.setColor(UMBER);g.fillRect(23,34,29,6)
                    g.setColor(INK);g.setStroke(new BasicStroke(3F))
                    g.drawArc(8,35,16,14,160,220)
                    g.drawArc(50,35,17,14,160,210)
                    g.setStroke(new BasicStroke(1F))
                    g.setColor(RUST)
                    g.fillPolygon([29,34,38,43,42,25] as int[],
                                  [61,49,59,46,66,66] as int[],6)
                    g.setColor(GOLD);g.fillOval(32,53,7,10)
                    g.setColor(INK)
                    g.drawArc(27,19,8,15,5,160)
                    g.drawArc(40,18,8,14,0,165)
                    g.fillRect(20,59,5,5);g.fillRect(48,59,5,5)
                    break
                }
                case 1: { // Tarp shelter, support pole, tied ropes and bedding.
                    g.setColor(KHAKI)
                    g.fillPolygon([10,31,62] as int[],[59,22,59] as int[],3)
                    g.setColor(UMBER)
                    g.fillPolygon([31,62,31] as int[],[22,59,59] as int[],3)
                    g.setColor(SAND)
                    g.fillPolygon([31,47,31] as int[],[29,59,59] as int[],3)
                    g.setColor(INK);g.setStroke(new BasicStroke(2F))
                    g.drawLine(31,19,31,65)
                    g.drawLine(11,59,7,64);g.drawLine(61,59,65,65)
                    g.setStroke(new BasicStroke(1F))
                    g.setColor(RUST);g.fillRect(22,56,29,6)
                    g.setColor(SAGE);g.fillRect(27,54,19,5)
                    break
                }
                case 2: { // Improvised water filter with two containers and tube.
                    g.setColor(UMBER);g.fillRoundRect(19,21,24,31,4,4)
                    g.setColor(SAND);g.fillRect(23,25,16,23)
                    g.setColor(KHAKI);g.fillRect(23,32,16,7)
                    g.setColor(INK);g.fillRect(17,19,28,5)
                    g.setColor(RUST);g.fillRect(29,23,5,5)
                    g.setColor(INK);g.setStroke(new BasicStroke(3F))
                    g.drawLine(31,50,31,55);g.drawLine(31,55,51,55)
                    g.setStroke(new BasicStroke(1F))
                    g.setColor(SAGE);g.fillOval(25,54,9,6)
                    g.setColor(INK);g.drawLine(47,37,59,37)
                    g.setColor(SAND);g.fillRoundRect(43,42,19,22,3,3)
                    g.setColor(SAGE);g.fillRect(46,53,13,8)
                    g.setColor(UMBER);g.drawRect(43,42,18,21)
                    break
                }
                case 3: { // Folding survey compass with rose and route annotations.
                    g.setColor(UMBER);g.fillRoundRect(13,19,52,46,4,4)
                    g.setColor(SAND);g.fillRoundRect(17,23,44,37,3,3)
                    g.setColor(INK);g.drawOval(23,25,30,30)
                    g.setColor(RUST)
                    g.fillPolygon([38,33,42] as int[],[26,40,39] as int[],3)
                    g.setColor(SAGE)
                    g.fillPolygon([36,32,41] as int[],[42,39,55] as int[],3)
                    g.setColor(INK);g.fillOval(35,37,7,7)
                    g.setFont(new Font('SansSerif',Font.BOLD,9))
                    g.drawString('N',35,23)
                    g.setColor(KHAKI);g.drawLine(18,27,22,27)
                    g.drawLine(54,55,60,55)
                    break
                }
                case 4: { // Patched travel satchel, rivets, buckle and fabric sewing.
                    g.setColor(INK);g.setStroke(new BasicStroke(4F))
                    g.drawArc(18,15,40,34,0,180)
                    g.setStroke(new BasicStroke(1F))
                    g.setColor(UMBER);g.fillRoundRect(14,31,49,33,6,6)
                    g.setColor(RUST);g.fillRoundRect(18,34,41,25,4,4)
                    g.setColor(SAND);g.fillRect(29,34,18,17)
                    g.setColor(INK);g.fillRect(33,35,11,20)
                    g.setColor(GOLD);g.fillRect(35,42,7,6)
                    g.setColor(INK);g.fillRect(13,45,8,12)
                    g.setColor(SAGE);g.fillRect(52,47,8,10)
                    g.setColor(SAND)
                    for(int j=0;j<5;j++){g.fillRect(22+j*7,58,3,2)}
                    g.setColor(GOLD);g.fillOval(18,36,4,4);g.fillOval(55,36,4,4)
                    break
                }
                case 5: { // Hand-built scrap cart with crate, axle and two big wheels.
                    g.setColor(INK);g.setStroke(new BasicStroke(3F))
                    g.drawLine(11,55,59,55);g.drawLine(55,50,65,34)
                    g.setStroke(new BasicStroke(1F))
                    g.setColor(UMBER);g.fillRect(15,33,40,21)
                    g.setColor(RUST);g.fillRect(18,35,34,17)
                    g.setColor(SAND);g.fillRect(20,38,30,3)
                    g.setColor(INK);g.drawLine(30,34,30,53)
                    g.setColor(KHAKI);g.fillRect(19,30,28,5)
                    g.setColor(INK);g.fillOval(15,50,18,18);g.fillOval(43,50,18,18)
                    g.setColor(SAND);g.fillOval(20,55,8,8);g.fillOval(48,55,8,8)
                    g.setColor(RUST);g.fillOval(23,58,2,2);g.fillOval(51,58,2,2)
                    break
                }
            }
            // Bold, inked headline and separate utility caption.
            g.setColor(INK);g.setFont(new Font('SansSerif',Font.BOLD,16))
            g.drawString(WORDS[id][0],70,33)
            g.setColor(UMBER);g.setFont(new Font('SansSerif',Font.BOLD,13))
            g.drawString(WORDS[id][1],70,49)
            g.setColor(RUST);g.fillRect(70,54,44,3)
            g.setColor(INK);g.setFont(new Font('Monospaced',Font.BOLD,8))
            g.drawString(WORDS[id][2],70,65)
            for(int j=0;j<155;j++){
                int x=5+rnd.nextInt(117),y=8+rnd.nextInt(65)
                g.setColor(j%3==0?new Color(251,232,196,76):
                           j%3==1?new Color(63,45,37,48):
                           new Color(151,83,53,59))
                g.fillRect(x,y,1+(j%19==0?2:0),1)
            }
            // Real pinholes: near-transparent source alpha, not flat texture.
            g.setComposite(AlphaComposite.Clear)
            for(int j=0;j<91;j++){
                int x=6+rnd.nextInt(115),y=9+rnd.nextInt(64)
                g.fillRect(x,y,j%17==0?3:1,1)
            }
            g.setComposite(AlphaComposite.SrcOver)
            g.setClip(null);g.dispose()
            ImageIO.write(img,'png',new File(dir,'brown_'+id+'.png'))
            def out=atlas.createGraphics()
            out.drawImage(img,(id%2)*W,Math.floorDiv(id,2)*H,null)
            out.dispose()
        }
        ImageIO.write(atlas,'png',new File(dir,'brown_atlas.png'))
        println 'Generated six original brown woodcut-style survival prints and 256x240 atlas.'
    }
}
tasks.named('processResources') {
    dependsOn tasks.named('generateBrownCardboardDecals')
    from(brownDecalOutput)
}
