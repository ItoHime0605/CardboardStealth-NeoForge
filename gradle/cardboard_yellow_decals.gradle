import java.awt.image.BufferedImage
import java.awt.Color
import java.awt.Font
import java.awt.BasicStroke
import java.awt.Polygon
import java.awt.AlphaComposite
import java.awt.RenderingHints
import javax.imageio.ImageIO

/**
 * Carpet #7 YELLOW: six ORIGINAL post-collapse hazard stickers.
 *
 * Yellow is NOT a recolor of industrial gray warnings or orange road signs:
 * the faces are hand-drawn unique hazard pictograms, aged striped corner
 * tape, scratched silkscreen printing and transparent cracked outlines.
 * Each 128x80 image has a separate design and is rendered without photos,
 * external licensed illustrations or shipped fonts.
 */
def yellowDecalOutput=layout.buildDirectory.dir('generated/cardboard-yellow-decals')
tasks.register('generateYellowCardboardDecals') {
    inputs.property('yellow-original-hazard-art','2026-11-06-six-hazard-illustrations-v1')
    outputs.dir(yellowDecalOutput)
    doLast {
        File dir=new File(yellowDecalOutput.get().asFile,
                'assets/cardboardstealth/textures/decals')
        dir.mkdirs()
        final int W=128,H=80
        final Color BLACK=new Color(44,40,37)
        final Color INK=new Color(64,50,39)
        final Color GOLD=new Color(235,181,64)
        final Color YELLOW=new Color(252,213,100)
        final Color FADED=new Color(231,209,160)
        final Color PALE=new Color(250,231,184)
        final Color RUST=new Color(145,62,52)
        final Color TEAL=new Color(63,112,110)
        final Color ASH=new Color(119,108,93)
        final String[][] TITLES=[
            ['FALLOUT','RADIATION'],
            ['BRIDGE','COLLAPSED'],
            ['BIOHAZARD','QUARANTINE'],
            ['HIGH','VOLTAGE'],
            ['SHAFT','UNSTABLE'],
            ['BAD WATER','DO NOT DRINK']
        ] as String[][]
        BufferedImage atlas=new BufferedImage(256,240,BufferedImage.TYPE_INT_ARGB)
        for(int id=0;id<6;id++) {
            java.util.Random rnd=new java.util.Random(568921L+16061L*id)
            BufferedImage img=new BufferedImage(W,H,BufferedImage.TYPE_INT_ARGB)
            def g=img.createGraphics()
            g.setRenderingHint(RenderingHints.KEY_ANTIALIASING,RenderingHints.VALUE_ANTIALIAS_OFF)
            g.setRenderingHint(RenderingHints.KEY_TEXT_ANTIALIASING,RenderingHints.VALUE_TEXT_ANTIALIAS_OFF)
            g.setRenderingHint(RenderingHints.KEY_FRACTIONALMETRICS,RenderingHints.VALUE_FRACTIONALMETRICS_OFF)
            // No plain filled rectangle: irregular paper tear and old enamel chips.
            Polygon torn=new Polygon()
            for(int x=5;x<=123;x+=7)torn.addPoint(x,4+rnd.nextInt(6))
            torn.addPoint(122,17);torn.addPoint(126,32)
            torn.addPoint(121,48);torn.addPoint(123,63)
            for(int x=118;x>=6;x-=7)torn.addPoint(x,71+rnd.nextInt(6))
            torn.addPoint(4,62);torn.addPoint(7,46);torn.addPoint(3,30)
            g.setColor(id==2?PALE:(id==5?new Color(231,220,185):FADED))
            g.fillPolygon(torn)
            g.setClip(torn)
            // Scuffed layered hazard borders, off-register printing.
            g.setColor(BLACK);g.fillRect(6,10,116,3)
            g.fillRect(6,66,116,5)
            g.setColor(GOLD);g.fillRect(6,13,116,4)
            for(int i=-11;i<139;i+=14) {
                g.setColor((i/14)%2==0?BLACK:RUST)
                g.fillPolygon([i,i+7,i+13,i+6] as int[],
                              [9,9,18,18] as int[],4)
            }
            g.setColor(id==3?BLACK:GOLD)
            g.fillRoundRect(10,21,54,42,5,5)
            // Six different unique central pictograms, built from geometry.
            switch(id) {
                case 0: { // Radiation trefoil plus broken dosimeter strip.
                    g.setColor(BLACK)
                    g.fillOval(16,24,42,36)
                    g.setColor(GOLD)
                    for(int a : [30,150,270])g.fillArc(19,27,36,30,a,47)
                    g.setColor(BLACK);g.fillOval(32,39,9,9)
                    g.setColor(PALE);g.drawOval(16,24,42,36)
                    g.setColor(RUST);g.fillRect(12,56,47,3)
                    break
                }
                case 1: { // Broken highway span and cracked bridge supports.
                    g.setColor(BLACK)
                    g.fillRect(13,36,17,5);g.fillRect(41,39,18,5)
                    g.fillRect(15,42,5,18);g.fillRect(51,45,5,15)
                    g.setColor(RUST)
                    g.fillPolygon([29,34,40,33] as int[],[36,43,36,50] as int[],4)
                    g.setColor(TEAL)
                    g.setStroke(new BasicStroke(2F))
                    for(int y=51;y<=59;y+=4)g.drawArc(15,y,43,6,10,160)
                    g.setStroke(new BasicStroke(1F));break
                }
                case 2: { // Three circular biological warning rings with core.
                    g.setColor(BLACK)
                    g.setStroke(new BasicStroke(5F))
                    for(int a : [15,135,255])g.drawArc(21,27,33,31,a,85)
                    g.setStroke(new BasicStroke(1F))
                    g.fillOval(31,39,11,11)
                    g.setColor(RUST)
                    g.fillRect(13,30,7,4);g.fillRect(52,43,8,4)
                    g.fillRect(33,54,6,6);break
                }
                case 3: { // Damaged transformer mast and huge lightning cut.
                    g.setColor(GOLD)
                    g.fillPolygon([40,27,30,41,38,42,30,58,53,37,43,37,49,27] as int[],
                                  [23,23,39,39,46,60,60,40,40,32,32,23] as int[],7)
                    g.setColor(PALE);g.setStroke(new BasicStroke(2F))
                    g.drawLine(17,26,56,26);g.drawLine(20,31,53,31)
                    g.setStroke(new BasicStroke(1F))
                    break
                }
                case 4: { // Cracked mine timber and collapsing rock formation.
                    g.setColor(BLACK)
                    g.fillRect(19,30,6,29);g.fillRect(48,30,6,29)
                    g.fillRect(19,30,35,6)
                    g.setColor(RUST);g.fillRect(36,31,3,8)
                    g.setColor(ASH)
                    g.fillPolygon([28,35,40,36,31] as int[],
                                  [22,19,26,33,29] as int[],5)
                    g.fillPolygon([42,50,57,54] as int[],
                                  [38,40,47,49] as int[],4)
                    g.setColor(PALE);g.drawLine(26,51,39,38)
                    break
                }
                case 5: { // Broken pipe leaking into crossed contaminated water.
                    g.setColor(BLACK)
                    g.fillRect(15,23,35,7)
                    g.fillRect(43,25,9,18)
                    g.setColor(TEAL)
                    g.fillOval(43,43,7,10);g.fillOval(38,52,8,8)
                    g.setStroke(new BasicStroke(3F))
                    g.drawArc(15,49,43,13,180,180)
                    g.drawArc(16,55,42,10,180,180)
                    g.setColor(RUST);g.drawLine(16,25,57,60)
                    g.drawLine(57,25,16,60)
                    g.setStroke(new BasicStroke(1F))
                    break
                }
            }
            // Separate right-hand information field; no tiny unreadable labels.
            g.setColor(id==3?BLACK:INK)
            g.setFont(new Font('SansSerif',Font.BOLD,
                    TITLES[id][0].length()>8?11:14))
            g.drawString(TITLES[id][0],69,35)
            g.setColor(RUST)
            g.setFont(new Font('Monospaced',Font.BOLD,
                    TITLES[id][1].length()>9?7:9))
            g.drawString(TITLES[id][1],69,51)
            g.setColor(BLACK);g.fillRect(69,55,44,2)
            g.setColor(TEAL)
            g.setFont(new Font('Monospaced',Font.BOLD,8))
            g.drawString('ZONE ZERO',69,64)
            // Unique natural abrasion, ink bleed and truly transparent nicks.
            for(int j=0;j<950;j++) {
                int x=6+rnd.nextInt(116),y=8+rnd.nextInt(65)
                int a=7+rnd.nextInt(62)
                g.setColor(j%4==0?new Color(45,42,39,a):
                           j%4==1?new Color(250,230,185,a):
                           new Color(143,71,54,a))
                g.fillRect(x,y,1+(j%11==0?2:0),1)
            }
            g.setComposite(AlphaComposite.Clear)
            for(int j=0;j<105;j++){
                int x=6+rnd.nextInt(115),y=8+rnd.nextInt(65)
                g.fillRect(x,y,j%19==0?3:1,1)
            }
            g.setComposite(AlphaComposite.SrcOver)
            g.setClip(null);g.dispose()
            ImageIO.write(img,'png',new File(dir,'yellow_'+id+'.png'))
            def output=atlas.createGraphics()
            output.drawImage(img,(id%2)*W,Math.floorDiv(id,2)*H,null)
            output.dispose()
        }
        ImageIO.write(atlas,'png',new File(dir,'yellow_atlas.png'))
        println 'Generated six original yellow hazard stickers and 256x240 atlas.'
    }
}
tasks.named('processResources') {
    dependsOn tasks.named('generateYellowCardboardDecals')
    from(yellowDecalOutput)
}
