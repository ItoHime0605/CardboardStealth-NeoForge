import java.awt.image.BufferedImage
import java.awt.Color
import javax.imageio.ImageIO

// Reproducible textures built with the JDK only: no Pillow, internet or custom tool.
// The file contents are bundled into the NeoForge JAR by processResources.
def generatedBoxTextures = layout.buildDirectory.dir('generated/cardboard-textures')

tasks.register('generateCardboardTextures') {
    inputs.property('texture-art-version', '2026-11-06-v1')
    outputs.dir(generatedBoxTextures)
    doLast {
        File destination = new File(generatedBoxTextures.get().asFile,
                'assets/cardboardstealth/textures/entity')
        destination.mkdirs()
        final int SIZE = 128
        java.util.Random paperRandom = new java.util.Random(606011L)
        BufferedImage paper = new BufferedImage(SIZE, SIZE, BufferedImage.TYPE_INT_ARGB)
        BufferedImage tape = new BufferedImage(SIZE, SIZE, BufferedImage.TYPE_INT_ARGB)
        BufferedImage stamp = new BufferedImage(SIZE, SIZE, BufferedImage.TYPE_INT_ARGB)

        // Subtle square-pixel paper fibres; matte, warm and restrained enough for
        // all sixteen colors to keep a recognizably cardboard surface.
        for (int y = 0; y < SIZE; y++) {
            for (int x = 0; x < SIZE; x++) {
                int noise = paperRandom.nextInt(13) - 6
                int fibre = (x % 23 == 0 && y % 5 < 2) ? -9 : 0
                int r = Math.max(0,Math.min(255,219 + noise + fibre))
                int g = Math.max(0,Math.min(255,212 + noise + fibre))
                int b = Math.max(0,Math.min(255,198 + noise + fibre))
                paper.setRGB(x,y,new Color(r,g,b).getRGB())

                int tapeNoise = paperRandom.nextInt(11) - 5
                int tapeFibre = (x % 17 == 0) ? 4 : 0
                int tr = Math.max(0,Math.min(255,226 + tapeNoise + tapeFibre))
                int tg = Math.max(0,Math.min(255,186 + tapeNoise + tapeFibre))
                int tb = Math.max(0,Math.min(255,138 + tapeNoise))
                tape.setRGB(x,y,new Color(tr,tg,tb).getRGB())
            }
        }
        // Sparse short paper-fibre streaks, never photographic smooth noise.
        for (int i=0;i<190;i++) {
            int x = paperRandom.nextInt(SIZE-3), y = paperRandom.nextInt(SIZE)
            int d = paperRandom.nextBoolean() ? 16 : -16
            for (int n=0;n<1+paperRandom.nextInt(3);n++) {
                int q=paper.getRGB(x+n,y)
                int rr=Math.min(255,Math.max(0,((q>>16)&255)+d))
                int gg=Math.min(255,Math.max(0,((q>>8)&255)+d))
                int bb=Math.min(255,Math.max(0,(q&255)+d))
                paper.setRGB(x+n,y,new Color(rr,gg,bb).getRGB())
            }
        }
        // Small pixel-green recycle print repeated on 8px UV cells.
        // The player-supplied item icon places this symbol on the rear only.
        int darkGreen = new Color(29,100,54,255).getRGB()
        int[][] icon = [
            [2,1],[3,1],[4,1],[5,2],[6,2],
            [5,3],[5,4],[4,5],[4,6],
            [3,5],[2,5],[1,4],[0,3],
            [1,3],[1,2],[2,2]
        ] as int[][]
        for (int y=0;y<SIZE;y+=8) {
            for (int x=0;x<SIZE;x+=8) {
                for (int[] dot : icon) {
                    stamp.setRGB(x+dot[0],y+dot[1],darkGreen)
                }
            }
        }
        ImageIO.write(paper,'png',new File(destination,'paper_refined.png'))
        ImageIO.write(tape,'png',new File(destination,'tape_refined.png'))
        ImageIO.write(stamp,'png',new File(destination,'recycle_stamp.png'))
        println 'Generated 3 Minecraft-style cardboard textures (128x128) for the NeoForge JAR.'
    }
}

tasks.named('processResources') {
    dependsOn tasks.named('generateCardboardTextures')
    from(generatedBoxTextures)
}
