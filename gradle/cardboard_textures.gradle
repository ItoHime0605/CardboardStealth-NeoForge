import java.awt.image.BufferedImage
import java.awt.Color
import javax.imageio.ImageIO

// Reproducible paper-art assets, authored in the Gradle build with JDK ImageIO.
// The 16 finished 64x64 item sprites have baked colors; no item tint-layer
// registration is required (which was transparent in the real NeoForge client).
def generatedBoxTextures = layout.buildDirectory.dir('generated/cardboard-textures')

tasks.register('generateCardboardTextures') {
    inputs.property('texture-art-version', '2026-11-06-restored-icon-mini-atlas-repair-v6')
    inputs.file(file('src/main/cardboard_art/recycle_mark_32.txt'))
    inputs.files(
        file('src/main/resources/assets/cardboardstealth/textures/item/box_dye_base.png'),
        file('src/main/resources/assets/cardboardstealth/textures/item/box_dye_details.png'))
    outputs.dir(generatedBoxTextures)
    doLast {
        File root = generatedBoxTextures.get().asFile
        File entityDir = new File(root, 'assets/cardboardstealth/textures/entity')
        File itemDir = new File(root, 'assets/cardboardstealth/textures/item/colored')
        File flatDir = new File(root, 'assets/cardboardstealth/textures/item/straight')
        File miniDir = new File(root, 'assets/cardboardstealth/textures/item/mini')
        entityDir.mkdirs()
        itemDir.mkdirs()
        flatDir.mkdirs()
        miniDir.mkdirs()
        final int SIZE = 128
        java.util.Random random = new java.util.Random(606011L)
        BufferedImage paper = new BufferedImage(SIZE, SIZE, BufferedImage.TYPE_INT_ARGB)
        BufferedImage tape = new BufferedImage(SIZE, SIZE, BufferedImage.TYPE_INT_ARGB)
        BufferedImage stamp = new BufferedImage(SIZE, SIZE, BufferedImage.TYPE_INT_ARGB)

        // Matte warm-gray neutral paper is shaded by the 3D model's dye color.
        // Keep fine square-pixel grain, small fibres, no photorealistic noise.
        for (int y=0; y<SIZE; y++) {
            for (int x=0; x<SIZE; x++) {
                int noise = random.nextInt(13) - 6
                int fibre = (x % 23 == 0 && y % 5 < 2) ? -9 : 0
                int rr = Math.max(0,Math.min(255,219 + noise + fibre))
                int gg = Math.max(0,Math.min(255,212 + noise + fibre))
                int bb = Math.max(0,Math.min(255,198 + noise + fibre))
                paper.setRGB(x,y,new Color(rr,gg,bb).getRGB())
                int tn = random.nextInt(11) - 5
                tape.setRGB(x,y,new Color(
                    Math.max(0,Math.min(255,226 + tn)),
                    Math.max(0,Math.min(255,186 + tn)),
                    Math.max(0,Math.min(255,138 + tn))).getRGB())
            }
        }
        for (int i=0; i<190; i++) {
            int x=random.nextInt(SIZE-3), y=random.nextInt(SIZE)
            int d=random.nextBoolean() ? 16 : -16
            int len=1+random.nextInt(3)
            for (int n=0;n<len;n++) {
                int q=paper.getRGB(x+n,y)
                paper.setRGB(x+n,y,new Color(
                    Math.max(0,Math.min(255,((q>>16)&255)+d)),
                    Math.max(0,Math.min(255,((q>>8)&255)+d)),
                    Math.max(0,Math.min(255,(q&255)+d))).getRGB())
            }
        }

        // Faithful 32x32 pixel recreation of the user's supplied green
        // recycling symbol. The one UV mapped quad on the rear (+Z) uses
        // only the 0..32 square of the otherwise transparent 128px atlas.
        List<String> symbol = file('src/main/cardboard_art/recycle_mark_32.txt')
                .readLines('UTF-8')
        assert symbol.size()==32 && symbol.every { it.length()==32 }
        int darkGreen = new Color(0,102,0,255).getRGB()
        for (int y=0;y<32;y++) for (int x=0;x<32;x++) {
            char mark = symbol[y].charAt(x)
            assert mark=='.' || mark=='#'
            if (mark=='#') stamp.setRGB(x,y,darkGreen)
        }
        ImageIO.write(paper,'png',new File(entityDir,'paper_refined.png'))
        ImageIO.write(tape,'png',new File(entityDir,'tape_refined.png'))
        ImageIO.write(stamp,'png',new File(entityDir,'recycle_stamp.png'))

        // Item models use the Minecraft BLOCK/ITEM texture atlas. Entity-only
        // textures are not guaranteed to stitch into that atlas, which caused
        // the user's bright magenta/black missing-texture tape on held and
        // dropped miniatures. Write separate, atlas-discoverable item copies;
        // never point mini-model #tape/#mark to textures/entity.
        BufferedImage miniTape=new BufferedImage(128,128,BufferedImage.TYPE_INT_ARGB)
        for(int y=0;y<128;y++)for(int x=0;x<128;x++){
            int px=tape.getRGB(x,y)
            int wear=(x%17==0&&y%6<2)?-10:((x*19+y*7)%41==0?-7:0)
            int rr=Math.max(0,Math.min(255,((px>>16)&255)+wear))
            int gg=Math.max(0,Math.min(255,((px>>8)&255)+wear))
            int bb=Math.max(0,Math.min(255,(px&255)+wear))
            miniTape.setRGB(x,y,(int)(0xFF000000L | (rr<<16) | (gg<<8) | bb))
        }
        ImageIO.write(miniTape,'png',new File(miniDir,'packing_tape.png'))
        ImageIO.write(stamp,'png',new File(miniDir,'recycle_stamp.png'))

        // Read the user's original drawn cardboard icon's masks and outline.
        // Layer 0 (gray paper with lit/shaded faces) is baked into solid dye RGB;
        // layer 1 (original tape, outline, rear recycle logo) stays unchanged.
        BufferedImage base = ImageIO.read(file(
            'src/main/resources/assets/cardboardstealth/textures/item/box_dye_base.png'))
        BufferedImage details = ImageIO.read(file(
            'src/main/resources/assets/cardboardstealth/textures/item/box_dye_details.png'))
        assert base.width==64 && base.height==64 && details.width==64 && details.height==64

        List<String> names = 'white orange magenta light_blue yellow lime pink gray light_gray cyan purple blue brown green red black'.split(' ')
        List<Integer> colors = [
            0xE9ECEF,0xEA8524,0xBE49C9,0x62B9DE,
            0xEBC62D,0x79BF39,0xE9A0B0,0x53565C,
            0xA7A9A9,0x258F95,0x8139AA,0x344D9F,
            0x81502C,0x517A35,0xA53A35,0x27272D
        ]
        for (int i=0;i<16;i++) {
            BufferedImage finalIcon = new BufferedImage(64,64,BufferedImage.TYPE_INT_ARGB)
            int tint=colors[i]
            for (int y=0;y<64;y++) for (int x=0;x<64;x++) {
                int q=base.getRGB(x,y)
                int a=(q >>> 24)&255
                if (a==0) continue
                int gray=(((q>>16)&255)+((q>>8)&255)+(q&255))/3
                int rr=Math.round(((tint>>16)&255)*gray/255F)
                int gg=Math.round(((tint>>8)&255)*gray/255F)
                int bb=Math.round((tint&255)*gray/255F)
                finalIcon.setRGB(x,y,(a<<24)|(rr<<16)|(gg<<8)|bb)
            }
            java.awt.Graphics2D g=finalIcon.createGraphics()
            g.drawImage(details,0,0,null)
            g.dispose()
            int opaque=0
            for (int y=0;y<64;y++) for (int x=0;x<64;x++)
                if (((finalIcon.getRGB(x,y)>>>24)&255)==255) opaque++
            if (opaque < 1800) throw new GradleException(
                    "Cardboard icon unexpectedly transparent: "+names[i]+" ("+opaque+" opaque pixels)")
            ImageIO.write(finalIcon,'png',new File(itemDir,names[i]+'_cardboard_box.png'))
        }
        // Retain these straight-on sprites solely as optional legacy assets.
        // The GUI models now use the original user-supplied item icon (three
        // base boxes) or the earlier 64px dyed art in textures/item/colored.
        // The miniature 3D artwork is exclusively for held/dropped/fixed views.
        //
        // The same palette is baked into the 3D miniature's paper material:
        // no runtime item tint layer or custom BEWLR is involved.
        Map<String,Integer> variants = [
            cardboard_box:0xCF9B66,
            delivery_box:0xAD4A40,
            supply_box:0x608044
        ]
        for (int i=0;i<names.size();i++)
            variants[names[i]+'_cardboard_box'] = colors[i]

        for (Map.Entry<String,Integer> entry : variants.entrySet()) {
            String name = entry.key
            int tint = entry.value

            // Full-coverage matte 128px paper texture for the real 3D miniature
            // (the free-standing box uses the separate existing worn-box layer).
            BufferedImage paper3d = new BufferedImage(128,128,BufferedImage.TYPE_INT_ARGB)
            for(int y=0;y<128;y++)for(int x=0;x<128;x++){
                int q=paper.getRGB(x,y)
                int bright=((q>>16)&255)
                int red=Math.round(((tint>>16)&255)*bright/255F)
                int green=Math.round(((tint>>8)&255)*bright/255F)
                int blue=Math.round((tint&255)*bright/255F)
                int argb = (int)(0xFF000000L | (red<<16) | (green<<8) | blue)
                paper3d.setRGB(x,y,argb)
            }
            ImageIO.write(paper3d,'png',new File(miniDir,name+'_paper.png'))

            // Back of a cardboard, viewed straight-on in the 2D inventory slot:
            // top tape, delicate seams, matte paper and a crisp recycle icon.
            // 64x64 RGBA: transparent background, fully opaque box body.
            BufferedImage flat = new BufferedImage(64,64,BufferedImage.TYPE_INT_ARGB)
            int outline = 0xFF000000 | (Math.round(((tint>>16)&255)*0.36F)<<16) |
                    (Math.round(((tint>>8)&255)*0.36F)<<8) |
                    Math.round((tint&255)*0.36F)
            int fold = 0xFF000000 | (Math.round(((tint>>16)&255)*0.59F)<<16) |
                    (Math.round(((tint>>8)&255)*0.59F)<<8) |
                    Math.round((tint&255)*0.59F)
            // A precise pixel rectangular silhouette, no angled 3D perspective.
            for(int y=7;y<=56;y++)for(int x=9;x<=54;x++){
                boolean border = (x==9||x==54||y==7||y==56)
                if (border){flat.setRGB(x,y,outline);continue}
                int ref = paper3d.getRGB((x*7)%128,(y*11)%128)
                float shadow = x<13?0.78F:(x>51?0.87F:(y>47?0.90F:1.0F))
                int rr=Math.round(((ref>>16)&255)*shadow)
                int gg=Math.round(((ref>>8)&255)*shadow)
                int bb=Math.round((ref&255)*shadow)
                int argb = (int)(0xFF000000L | (rr<<16) | (gg<<8) | bb)
                flat.setRGB(x,y,argb)
            }
            for(int x=10;x<54;x++){
                flat.setRGB(x,48,fold) // fold where the lower closure begins
                if(x>=13 && x<=50)flat.setRGB(x,11,fold)
            }
            // The rear right has a readable 13px green recycle mark.
            for (int oy=0;oy<13;oy++)for (int ox=0;ox<13;ox++) {
                int srcX=Math.min(31,Math.round((ox+0.5F)*32F/13F))
                int srcY=Math.min(31,Math.round((oy+0.5F)*32F/13F))
                if(symbol[srcY].charAt(srcX)=='#')
                    flat.setRGB(36+ox,33+oy,darkGreen)
            }
            // Vertical folded seal and restrained paper tape on top.
            for (int y=8;y<=23;y++)for (int x=29;x<=34;x++){
                int sample=tape.getRGB(x*3,y*4)
                flat.setRGB(x,y,sample)
            }
            // Raised 1px tape edges keep the design pixel-art rather than smooth.
            for(int y=8;y<=22;y++) {
                flat.setRGB(28,y,fold)
                flat.setRGB(35,y,fold)
            }
            // Slightly projecting pair of lower flaps, still in a frontal 2D view.
            for(int x=7;x<57;x++) {
                if(x==7||x==56)flat.setRGB(x,55,outline)
                else flat.setRGB(x,55,fold)
            }
            ImageIO.write(flat,'png',new File(flatDir,name+'.png'))
        }

        println 'Restored original 2D item icons; generated 19 miniature paper textures and item-atlas-safe tape/recycle artwork.'
    }
}

tasks.named('processResources') {
    dependsOn tasks.named('generateCardboardTextures')
    from(generatedBoxTextures)
}
