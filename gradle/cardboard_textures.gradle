import java.awt.image.BufferedImage
import java.awt.Color
import javax.imageio.ImageIO

// Reproducible paper-art assets, authored in the Gradle build with JDK ImageIO.
// The 16 finished 64x64 item sprites have baked colors; no item tint-layer
// registration is required (which was transparent in the real NeoForge client).
def generatedBoxTextures = layout.buildDirectory.dir('generated/cardboard-textures')

tasks.register('generateCardboardTextures') {
    inputs.property('texture-art-version', '2026-11-06-full-checklist-v3')
    inputs.files(
        file('src/main/resources/assets/cardboardstealth/textures/item/box_dye_base.png'),
        file('src/main/resources/assets/cardboardstealth/textures/item/box_dye_details.png'))
    outputs.dir(generatedBoxTextures)
    doLast {
        File root = generatedBoxTextures.get().asFile
        File entityDir = new File(root, 'assets/cardboardstealth/textures/entity')
        File itemDir = new File(root, 'assets/cardboardstealth/textures/item/colored')
        entityDir.mkdirs()
        itemDir.mkdirs()
        final int SIZE = 128
        java.util.Random random = new java.util.Random(606011L)
        BufferedImage paper = new BufferedImage(SIZE, SIZE, BufferedImage.TYPE_INT_ARGB)
        BufferedImage tape = new BufferedImage(SIZE, SIZE, BufferedImage.TYPE_INT_ARGB)
        BufferedImage stamp = new BufferedImage(SIZE, SIZE, BufferedImage.TYPE_INT_ARGB)

        // Matte warm-gray neutral paper is shaded by the 3D model's dye color.
        // Keep fine square-pixel grain, small fibres, no photorealistic noise.
        for (int y=0; y<SIZE; y++) {
            for (int x=0; x<SIZE; x++) {
                int noise = random.nextInt(13) - 6
                int fibre = (x % 23 == 0 && y % 5 < 2) ? -9 : 0
                int rr = Math.max(0,Math.min(255,219 + noise + fibre))
                int gg = Math.max(0,Math.min(255,212 + noise + fibre))
                int bb = Math.max(0,Math.min(255,198 + noise + fibre))
                paper.setRGB(x,y,new Color(rr,gg,bb).getRGB())
                int tn = random.nextInt(11) - 5
                tape.setRGB(x,y,new Color(
                    Math.max(0,Math.min(255,226 + tn)),
                    Math.max(0,Math.min(255,186 + tn)),
                    Math.max(0,Math.min(255,138 + tn))).getRGB())
            }
        }
        for (int i=0; i<190; i++) {
            int x=random.nextInt(SIZE-3), y=random.nextInt(SIZE)
            int d=random.nextBoolean() ? 16 : -16
            int len=1+random.nextInt(3)
            for (int n=0;n<len;n++) {
                int q=paper.getRGB(x+n,y)
                paper.setRGB(x+n,y,new Color(
                    Math.max(0,Math.min(255,((q>>16)&255)+d)),
                    Math.max(0,Math.min(255,((q>>8)&255)+d)),
                    Math.max(0,Math.min(255,(q&255)+d))).getRGB())
            }
        }

        // Four curved inward-pointing recycle arrows, adapted pixel-by-pixel
        // from the user's green recycling-logo reference. Atlas UV 0..32px is
        // mapped to a SINGLE quad on the rear face: no more cropped glyphs.
        List<String> symbol = [
            '.######.#######.',
            '######.#########',
            '##.....##.....##',
            '##.....##.....##',
            '##....####....##',
            '##.....##.....##',
            '##..#......#...#',
            '######....#####.',
            '.#####....######',
            '#...#......#..##',
            '##.....##.....##',
            '##....####....##',
            '##.....##.....##',
            '##.....##.....##',
            '#########.######',
            '.#######.######.'
        ]
        assert symbol.size()==16 && symbol.every { it.length()==16 }
        int darkGreen = new Color(0,102,0,255).getRGB()
        for (int y=0;y<16;y++) {
            for (int x=0;x<16;x++) {
                if (symbol[y].charAt(x) == '#') {
                    for (int yy=0;yy<2;yy++) for (int xx=0;xx<2;xx++)
                        stamp.setRGB(x*2+xx,y*2+yy,darkGreen)
                }
            }
        }
        ImageIO.write(paper,'png',new File(entityDir,'paper_refined.png'))
        ImageIO.write(tape,'png',new File(entityDir,'tape_refined.png'))
        ImageIO.write(stamp,'png',new File(entityDir,'recycle_stamp.png'))

        // Read the user's original drawn cardboard icon's masks and outline.
        // Layer 0 (gray paper with lit/shaded faces) is baked into solid dye RGB;
        // layer 1 (original tape, outline, rear recycle logo) stays unchanged.
        BufferedImage base = ImageIO.read(file(
            'src/main/resources/assets/cardboardstealth/textures/item/box_dye_base.png'))
        BufferedImage details = ImageIO.read(file(
            'src/main/resources/assets/cardboardstealth/textures/item/box_dye_details.png'))
        assert base.width==64 && base.height==64 && details.width==64 && details.height==64

        List<String> names = 'white orange magenta light_blue yellow lime pink gray light_gray cyan purple blue brown green red black'.split(' ')
        List<Integer> colors = [
            0xE9ECEF,0xEA8524,0xBE49C9,0x62B9DE,
            0xEBC62D,0x79BF39,0xE9A0B0,0x53565C,
            0xA7A9A9,0x258F95,0x8139AA,0x344D9F,
            0x81502C,0x517A35,0xA53A35,0x27272D
        ]
        for (int i=0;i<16;i++) {
            BufferedImage finalIcon = new BufferedImage(64,64,BufferedImage.TYPE_INT_ARGB)
            int tint=colors[i]
            for (int y=0;y<64;y++) for (int x=0;x<64;x++) {
                int q=base.getRGB(x,y)
                int a=(q >>> 24)&255
                if (a==0) continue
                int gray=(((q>>16)&255)+((q>>8)&255)+(q&255))/3
                int rr=Math.round(((tint>>16)&255)*gray/255F)
                int gg=Math.round(((tint>>8)&255)*gray/255F)
                int bb=Math.round((tint&255)*gray/255F)
                finalIcon.setRGB(x,y,(a<<24)|(rr<<16)|(gg<<8)|bb)
            }
            java.awt.Graphics2D g=finalIcon.createGraphics()
            g.drawImage(details,0,0,null)
            g.dispose()
            int opaque=0
            for (int y=0;y<64;y++) for (int x=0;x<64;x++)
                if (((finalIcon.getRGB(x,y)>>>24)&255)==255) opaque++
            if (opaque < 1800) throw new GradleException(
                    "Cardboard icon unexpectedly transparent: "+names[i]+" ("+opaque+" opaque pixels)")
            ImageIO.write(finalIcon,'png',new File(itemDir,names[i]+'_cardboard_box.png'))
        }
        println 'Generated three 128px entity textures and sixteen complete opaque-base 64px dyed box icons.'
    }
}

tasks.named('processResources') {
    dependsOn tasks.named('generateCardboardTextures')
    from(generatedBoxTextures)
}
