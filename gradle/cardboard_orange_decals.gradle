import java.awt.image.BufferedImage
import java.awt.Color
import java.awt.Font
import java.awt.BasicStroke
import java.awt.Polygon
import java.awt.AlphaComposite
import java.awt.RenderingHints
import javax.imageio.ImageIO

/**
 * Carpet #6 ORANGE: six individually illustrated, worn roadside relics.
 * This is NOT a recolor of the warehouse labels, black graffiti or red
 * pin-up posters. Entirely original artwork, rendered deterministically.
 * No external images, copyrighted insignia or distributable font files.
 */
def orangeDecalOutput = layout.buildDirectory.dir('generated/cardboard-orange-decals')
tasks.register('generateOrangeCardboardDecals') {
    inputs.property('orange-roadside-art-revision','2026-11-06-six-highway-relics-v1')
    outputs.dir(orangeDecalOutput)
    doLast {
        File dir = new File(orangeDecalOutput.get().asFile,
                'assets/cardboardstealth/textures/decals')
        dir.mkdirs()
        final int W=128, H=80
        final Color AMBER=new Color(228,157,65)
        final Color ORANGE=new Color(196,95,43)
        final Color RUST=new Color(132,57,42)
        final Color PALE=new Color(248,216,162)
        final Color DUST=new Color(203,171,127)
        final Color DARK=new Color(54,47,43)
        final Color NIGHT=new Color(51,66,68)
        final Color TEAL=new Color(80,131,124)
        final Color WHITE=new Color(239,229,199)
        final String[][] TITLES=[
            ['MILE 0','END OF ROAD'],
            ['LAST FUEL','NO REFILLS'],
            ['SUNSET','DINER 24/7'],
            ['NO SIGNAL','DEAD ZONE'],
            ['EVAC ROUTE','TAKE WEST'],
            ['SCRAP RUN','TOW & TRADE']
        ] as String[][]
        BufferedImage atlas = new BufferedImage(256,240,BufferedImage.TYPE_INT_ARGB)
        for(int id=0;id<6;id++) {
            java.util.Random rnd = new java.util.Random(86113L+10133L*id)
            BufferedImage img = new BufferedImage(W,H,BufferedImage.TYPE_INT_ARGB)
            java.awt.Graphics2D g=img.createGraphics()
            g.setRenderingHint(RenderingHints.KEY_ANTIALIASING,RenderingHints.VALUE_ANTIALIAS_OFF)
            g.setRenderingHint(RenderingHints.KEY_TEXT_ANTIALIASING,RenderingHints.VALUE_TEXT_ANTIALIAS_OFF)
            g.setRenderingHint(RenderingHints.KEY_FRACTIONALMETRICS,RenderingHints.VALUE_FRACTIONALMETRICS_OFF)
            // Torn sun-baked cardboard or enamel sign outline; no opaque rectangle.
            Polygon torn=new Polygon()
            for(int x=5;x<=122;x+=7) torn.addPoint(x,4+rnd.nextInt(5))
            torn.addPoint(123,15);torn.addPoint(120,31)
            torn.addPoint(124,47);torn.addPoint(121,65)
            for(int x=118;x>=6;x-=7) torn.addPoint(x,71+rnd.nextInt(5))
            torn.addPoint(4,61);torn.addPoint(7,45);torn.addPoint(3,27)
            g.setColor(id==3?NIGHT:id==4?PALE:DUST)
            g.fillPolygon(torn)
            g.setClip(torn)
            g.setColor(id==3?TEAL:ORANGE)
            g.fillRect(6,8,116,3)
            g.fillRect(6,69,116,3)
            // Deep silkscreen scuff marks and yellowed ink dust.
            for(int k=0;k<860;k++){
                int x=5+rnd.nextInt(118),y=10+rnd.nextInt(59)
                int alpha=14+rnd.nextInt(63)
                g.setColor(k%4==0 ? new Color(64,44,37,alpha) :
                           k%4==1 ? new Color(245,232,173,alpha) :
                           new Color(182,81,39,alpha))
                g.fillRect(x,y,1+rnd.nextInt(2),1)
            }
            // A different *illustration*, not a reused badge, for each poster.
            switch(id) {
                case 0: { // Emptied road, two converging lanes and old mile marker.
                    g.setColor(AMBER);g.fillOval(3,13,62,51)
                    g.setColor(NIGHT)
                    g.fillPolygon([14,54,40,29] as int[],[68,68,25,25] as int[],4)
                    g.setColor(PALE)
                    g.drawLine(33,65,35,56);g.drawLine(36,48,37,40)
                    g.setColor(DARK);g.fillRect(13,19,18,25)
                    g.setColor(WHITE);g.fillRect(15,21,14,2)
                    g.setFont(new Font('SansSerif',Font.BOLD,12));g.drawString('0',17,37)
                    g.setColor(ORANGE);g.drawLine(10,53,18,49)
                    break
                }
                case 1: { // Rusted gas pump, hanging hose, broken dial.
                    g.setColor(DARK);g.fillRoundRect(13,16,41,50,6,6)
                    g.setColor(AMBER);g.fillRect(18,21,31,25)
                    g.setColor(WHITE);g.fillRect(23,25,21,15)
                    g.setColor(RUST);g.fillRect(27,30,13,5)
                    g.setColor(WHITE);g.setFont(new Font('Monospaced',Font.BOLD,8))
                    g.drawString('00',26,38)
                    g.setColor(TEAL);g.fillRect(21,49,23,8)
                    g.setColor(NIGHT);g.setStroke(new BasicStroke(4F))
                    g.drawArc(48,28,15,27,200,160)
                    g.setStroke(new BasicStroke(1F))
                    g.fillRect(57,53,5,12)
                    g.setColor(ORANGE);g.drawLine(9,18,17,15)
                    break
                }
                case 2: { // Retro roadside diner cup, table and sunset rays.
                    g.setColor(ORANGE);g.fillOval(1,14,65,54)
                    g.setColor(PALE)
                    for(int j=0;j<5;j++)g.drawLine(34,15,5+j*12,38)
                    g.setColor(NIGHT);g.fillRect(10,61,50,4)
                    g.setColor(WHITE);g.fillRoundRect(18,37,29,24,4,4)
                    g.setColor(DARK);g.setStroke(new BasicStroke(3F))
                    g.drawArc(41,41,20,18,260,250)
                    g.setStroke(new BasicStroke(1F))
                    g.setColor(AMBER);g.fillRect(21,53,22,3)
                    g.setColor(WHITE)
                    g.drawArc(23,20,11,19,10,145);g.drawArc(36,18,10,20,10,160)
                    break
                }
                case 3: { // Lost radio tower, concentric interference rings.
                    g.setColor(AMBER);g.fillOval(3,14,59,55)
                    g.setColor(DARK);g.setStroke(new BasicStroke(3F))
                    g.drawLine(30,61,39,20);g.drawLine(39,20,49,61)
                    g.drawLine(33,48,45,48);g.drawLine(36,35,42,35)
                    g.setStroke(new BasicStroke(2F))
                    g.drawArc(20,17,40,34,16,145)
                    g.drawArc(14,12,50,42,16,145)
                    g.setColor(ORANGE);g.drawLine(10,61,57,22)
                    g.setStroke(new BasicStroke(1F))
                    break
                }
                case 4: { // Evacuation zig-zag road, battered arrowhead and map.
                    g.setColor(TEAL);g.fillRect(9,15,54,49)
                    g.setColor(WHITE);g.setStroke(new BasicStroke(5F))
                    g.drawLine(17,57,29,44);g.drawLine(29,44,27,28)
                    g.drawLine(27,28,47,20)
                    g.setColor(AMBER)
                    g.drawLine(40,19,48,20);g.drawLine(47,20,43,28)
                    g.setColor(RUST);g.setStroke(new BasicStroke(3F))
                    g.drawLine(20,20,54,54);g.drawLine(54,20,20,54)
                    g.setStroke(new BasicStroke(1F))
                    break
                }
                case 5: { // Salvage tow truck, wheels, dangling towing hook.
                    g.setColor(AMBER);g.fillOval(5,13,60,49)
                    g.setColor(NIGHT);g.fillRect(10,43,47,17)
                    g.fillPolygon([10,24,34,36] as int[],
                                  [43,32,32,43] as int[],4)
                    g.setColor(TEAL);g.fillRect(26,35,8,8)
                    g.setColor(ORANGE);g.fillRect(35,22,5,27)
                    g.setColor(DARK);g.setStroke(new BasicStroke(3F))
                    g.drawLine(37,24,60,18);g.drawLine(60,18,60,44)
                    g.setStroke(new BasicStroke(1F));g.drawArc(56,43,8,10,190,185)
                    g.setColor(DARK);g.fillOval(17,51,14,14);g.fillOval(42,51,14,14)
                    g.setColor(WHITE);g.fillOval(21,55,6,6);g.fillOval(46,55,6,6)
                    break
                }
            }
            // Right-side type, with two bands and prominent poster hierarchy.
            g.setColor(id==3?WHITE:DARK)
            g.setFont(new Font('SansSerif',Font.BOLD,TITLES[id][0].length()>8?9:13))
            g.drawString(TITLES[id][0],70,33)
            g.setColor(id==3?AMBER:RUST)
            g.setFont(new Font('Monospaced',Font.BOLD,TITLES[id][1].length()>9?7:8))
            g.drawString(TITLES[id][1],70,49)
            g.setColor(id==3?TEAL:ORANGE)
            g.fillRect(70,54,45,3)
            g.setColor(id==3?PALE:NIGHT)
            g.setFont(new Font('Monospaced',Font.BOLD,8))
            g.drawString('EST. 2029',71,65)
            // Scratched printing, true cut-out pinholes and ragged paper damage.
            for(int k=0;k<170;k++){
                int x=5+rnd.nextInt(119),y=8+rnd.nextInt(63)
                g.setColor(k%2==0 ? new Color(251,228,172,70):
                           new Color(65,47,42,42))
                g.fillRect(x,y,1+(k%19==0?2:0),1)
            }
            g.setComposite(AlphaComposite.Clear)
            for(int k=0;k<87;k++){
                int x=7+rnd.nextInt(114),y=9+rnd.nextInt(63)
                g.fillRect(x,y,k%17==0?3:1,1)
            }
            g.setComposite(AlphaComposite.SrcOver)
            g.setClip(null);g.dispose()
            ImageIO.write(img,'png',new File(dir,'orange_'+id+'.png'))
            def out=atlas.createGraphics()
            out.drawImage(img,(id%2)*128,Math.floorDiv(id,2)*80,null)
            out.dispose()
        }
        ImageIO.write(atlas,'png',new File(dir,'orange_atlas.png'))
        println 'Generated six original orange roadside illustrated posters, plus 256x240 atlas.'
    }
}
tasks.named('processResources') {
    dependsOn tasks.named('generateOrangeCardboardDecals')
    from(orangeDecalOutput)
}
