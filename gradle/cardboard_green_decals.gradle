import java.awt.image.BufferedImage
import java.awt.Color
import java.awt.Font
import java.awt.BasicStroke
import java.awt.Polygon
import java.awt.AlphaComposite
import java.awt.RenderingHints
import javax.imageio.ImageIO

/**
 * Family #11 GREEN: six original olive/field-green post-collapse outpost prints.
 *
 * Distinct compositions: guard tower, scavenger barricade, field respirator,
 * emergency signal mast, improvised shelter entrance, and watchlight station.
 * Rendered offline in Java2D, without outside pictures or font files.
 */
def greenDecalOutput=layout.buildDirectory.dir('generated/cardboard-green-decals')
tasks.register('generateGreenCardboardDecals') {
    inputs.property('green-outpost-art-revision','2026-11-06-six-original-outpost-v1')
    outputs.dir(greenDecalOutput)
    doLast {
        File dir=new File(greenDecalOutput.get().asFile,
                'assets/cardboardstealth/textures/decals')
        dir.mkdirs()
        final int W=128,H=80
        final Color FOREST=new Color(38,65,50)
        final Color OLIVE=new Color(79,105,59)
        final Color MOSS=new Color(115,137,73)
        final Color PALE=new Color(230,222,173)
        final Color KHAKI=new Color(192,190,138)
        final Color CHARCOAL=new Color(44,48,41)
        final Color RUST=new Color(152,92,57)
        final Color WARM=new Color(224,160,83)
        final Color SIGNAL=new Color(218,116,65)
        final Color COOL=new Color(99,157,139)
        final String[][] TITLES=[
            ['WATCH','TOWER','SECTOR 03'],
            ['HOLD','THE LINE','ROADBLOCK'],
            ['AIR','CHECK','FILTER MASK'],
            ['SEND','SIGNAL','OUTPOST 7'],
            ['SAFE','GATE','SHELTER 2'],
            ['NIGHT','WATCH','PERIMETER']
        ] as String[][]
        BufferedImage atlas=new BufferedImage(256,240,BufferedImage.TYPE_INT_ARGB)
        for(int id=0;id<6;id++){
            java.util.Random rnd=new java.util.Random(206017L+12289L*id)
            BufferedImage img=new BufferedImage(W,H,BufferedImage.TYPE_INT_ARGB)
            def g=img.createGraphics()
            g.setRenderingHint(RenderingHints.KEY_ANTIALIASING,RenderingHints.VALUE_ANTIALIAS_OFF)
            g.setRenderingHint(RenderingHints.KEY_TEXT_ANTIALIASING,RenderingHints.VALUE_TEXT_ANTIALIAS_OFF)
            g.setRenderingHint(RenderingHints.KEY_FRACTIONALMETRICS,RenderingHints.VALUE_FRACTIONALMETRICS_OFF)
            // Real alpha beyond a ragged silhouette. No opaque square texture.
            Polygon torn=new Polygon()
            for(int x=5;x<=122;x+=7)torn.addPoint(x,4+rnd.nextInt(6))
            torn.addPoint(123,16);torn.addPoint(121,29);torn.addPoint(125,45)
            torn.addPoint(122,62)
            for(int x=117;x>=8;x-=7)torn.addPoint(x,71+rnd.nextInt(6))
            torn.addPoint(4,62);torn.addPoint(7,44);torn.addPoint(3,27)
            g.setColor(id%2==0?new Color(188,192,143):new Color(177,184,134))
            g.fillPolygon(torn)
            g.setClip(torn)
            // Perforated field-manual border with old stencil printing.
            g.setColor(FOREST);g.fillRect(6,9,117,5)
            g.fillRect(6,68,117,4)
            g.setColor(OLIVE);g.fillRect(8,14,112,4)
            g.setColor(KHAKI);g.fillRect(8,19,56,46)
            g.setColor(CHARCOAL);g.fillRect(65,17,2,49)
            g.setColor(RUST)
            for(int i=0;i<6;i++)g.fillRect(11+i*9,18,3,3)
            // Paper flecks beneath the actual pictogram, repeatable seed.
            for(int j=0;j<880;j++){
                int x=7+rnd.nextInt(115),y=10+rnd.nextInt(60)
                int a=6+rnd.nextInt(59)
                g.setColor(j%4==0?new Color(36,50,41,a):
                           j%4==1?new Color(242,228,179,a):
                           j%4==2?new Color(126,92,62,a):
                           new Color(97,141,95,a))
                g.fillRect(x,y,1+(j%13==0?2:0),1)
            }
            switch(id){
                case 0: { // Elevated watchtower with ladder and guard rails.
                    g.setColor(CHARCOAL);g.setStroke(new BasicStroke(3F))
                    g.drawLine(16,65,28,29);g.drawLine(57,65,47,29)
                    g.drawLine(27,41,49,41);g.drawLine(22,55,52,55)
                    g.setStroke(new BasicStroke(1F))
                    g.setColor(OLIVE);g.fillRect(19,28,40,14)
                    g.setColor(FOREST);g.fillPolygon([14,39,61] as int[],
                        [29,17,29] as int[],3)
                    g.setColor(PALE);g.fillRect(26,31,9,5);g.fillRect(41,31,9,5)
                    g.setColor(RUST);g.fillRect(34,42,4,22)
                    g.setColor(KHAKI)
                    for(int y=46;y<=62;y+=5)g.fillRect(31,y,11,2)
                    g.setColor(WARM);g.fillOval(53,23,7,7)
                    break
                }
                case 1: { // Road barricade with heavy planks and spiked supports.
                    g.setColor(CHARCOAL);g.setStroke(new BasicStroke(3F))
                    g.drawLine(12,62,25,27);g.drawLine(60,62,48,27)
                    g.setStroke(new BasicStroke(1F))
                    g.setColor(RUST);g.fillRect(12,31,51,12)
                    g.setColor(OLIVE);g.fillRect(10,45,56,11)
                    g.setColor(PALE)
                    for(int j=0;j<5;j++)g.fillPolygon(
                        [13+j*10,18+j*10,23+j*10,18+j*10] as int[],
                        [45,45,56,56] as int[],4)
                    g.setColor(FOREST);g.fillRect(11,54,52,4)
                    g.setColor(WARM);g.fillOval(26,25,7,7);g.fillOval(48,25,7,7)
                    break
                }
                case 2: { // Filter respirator, eyepieces, two filter cartridges.
                    g.setColor(FOREST);g.fillOval(15,19,48,39)
                    g.setColor(CHARCOAL);g.fillOval(18,22,42,34)
                    g.setColor(PALE);g.fillOval(21,27,15,13);g.fillOval(42,27,15,13)
                    g.setColor(COOL);g.fillOval(24,29,11,9);g.fillOval(45,29,10,9)
                    g.setColor(OLIVE);g.fillOval(30,39,18,20)
                    g.setColor(CHARCOAL);g.fillRect(32,48,15,12)
                    g.setColor(KHAKI);g.fillRect(35,52,9,3)
                    g.setColor(FOREST);g.fillOval(8,41,16,17);g.fillOval(55,41,14,17)
                    g.setColor(PALE)
                    for(int j=0;j<4;j++){g.fillRect(11,45+j*3,11,1);g.fillRect(56,45+j*3,9,1)}
                    break
                }
                case 3: { // Handmade emergency signal mast and distress waves.
                    g.setColor(CHARCOAL);g.setStroke(new BasicStroke(3F))
                    g.drawLine(39,17,39,63);g.drawLine(39,33,21,61)
                    g.drawLine(39,33,57,61)
                    g.setStroke(new BasicStroke(1F))
                    g.setColor(RUST);g.fillRect(34,20,10,12)
                    g.setColor(PALE);g.fillOval(33,15,13,10)
                    g.setColor(SIGNAL);g.fillOval(36,18,7,6)
                    g.setColor(FOREST);g.fillRect(21,61,36,4)
                    g.setColor(COOL);g.setStroke(new BasicStroke(2F))
                    g.drawArc(16,15,46,31,20,140)
                    g.drawArc(10,10,58,42,20,140)
                    g.setStroke(new BasicStroke(1F))
                    g.setColor(OLIVE);g.fillRect(24,48,29,3)
                    break
                }
                case 4: { // Shelter bulkhead, patched door and entry lamp.
                    g.setColor(CHARCOAL);g.fillRoundRect(13,22,49,44,4,4)
                    g.setColor(OLIVE);g.fillRoundRect(18,27,39,38,3,3)
                    g.setColor(FOREST);g.fillRect(24,31,26,28)
                    g.setColor(PALE);g.fillRect(28,35,16,5)
                    g.setColor(KHAKI);g.drawRect(25,32,25,25)
                    g.setColor(WARM);g.fillOval(48,46,6,6)
                    g.setColor(RUST);g.fillRect(12,19,52,5)
                    g.setColor(PALE);g.fillRect(32,20,12,3)
                    g.setColor(COOL);g.fillRect(9,45,5,14);g.fillRect(62,45,5,14)
                    g.setColor(WARM);g.fillOval(20,16,8,7);g.fillOval(49,16,8,7)
                    break
                }
                case 5: { // Floodlight patrol, tripod mast and light cone.
                    g.setColor(FOREST);g.fillRect(8,56,55,8)
                    g.setColor(CHARCOAL);g.setStroke(new BasicStroke(4F))
                    g.drawLine(22,62,37,27);g.drawLine(54,62,37,27)
                    g.setStroke(new BasicStroke(1F))
                    g.setColor(OLIVE);g.fillRect(31,19,31,15)
                    g.setColor(PALE);g.fillRect(40,22,18,8)
                    g.setColor(WARM);g.fillOval(46,24,8,6)
                    g.setColor(KHAKI);g.fillPolygon([31,60,66,34] as int[],
                        [33,34,53,52] as int[],4)
                    g.setColor(CHARCOAL);g.drawLine(37,31,37,61)
                    g.setColor(RUST);g.fillRect(14,50,11,4)
                    g.setColor(COOL);g.fillRect(7,43,16,3)
                    break
                }
            }
            g.setColor(FOREST)
            g.setFont(new Font('SansSerif',Font.BOLD,15))
            g.drawString(TITLES[id][0],70,33)
            g.setColor(RUST)
            g.setFont(new Font('SansSerif',Font.BOLD,TITLES[id][1].length()>6?11:13))
            g.drawString(TITLES[id][1],70,49)
            g.setColor(OLIVE);g.fillRect(69,54,47,3)
            g.setColor(CHARCOAL);g.setFont(new Font('Monospaced',Font.BOLD,8))
            g.drawString(TITLES[id][2],69,65)
            for(int j=0;j<165;j++){
                int x=6+rnd.nextInt(115),y=7+rnd.nextInt(65)
                g.setColor(j%3==0?new Color(240,233,191,66):
                           j%3==1?new Color(42,49,38,47):
                           new Color(165,91,59,61))
                g.fillRect(x,y,1+(j%19==0?2:0),1)
            }
            g.setComposite(AlphaComposite.Clear)
            for(int j=0;j<99;j++){
                int x=6+rnd.nextInt(115),y=9+rnd.nextInt(63)
                g.fillRect(x,y,j%17==0?3:1,1)
            }
            g.setComposite(AlphaComposite.SrcOver)
            g.setClip(null);g.dispose()
            ImageIO.write(img,'png',new File(dir,'green_'+id+'.png'))
            def composite=atlas.createGraphics()
            composite.drawImage(img,(id%2)*W,Math.floorDiv(id,2)*H,null)
            composite.dispose()
        }
        ImageIO.write(atlas,'png',new File(dir,'green_atlas.png'))
        println 'Generated six original green outpost posters and matching atlas.'
    }
}
tasks.named('processResources') {
    dependsOn tasks.named('generateGreenCardboardDecals')
    from(greenDecalOutput)
}
