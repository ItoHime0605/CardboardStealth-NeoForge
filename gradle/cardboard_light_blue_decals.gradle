import java.awt.image.BufferedImage
import java.awt.Color
import java.awt.Font
import java.awt.BasicStroke
import java.awt.Polygon
import java.awt.AlphaComposite
import java.awt.RenderingHints
import javax.imageio.ImageIO

/**
 * LIGHT BLUE, family 16/16: six original post-collapse airport / lost-flight prints.
 *
 * Unique focal silhouettes: airport control tower, grounded propeller cargo plane,
 * parachute supply crate, terminal departure board, dead runway lights, and
 * recovered orange flight data recorder. They are NOT alternate palettes for the
 * existing cyan meteorology or blue seaport posters.
 *
 * Java2D deterministic source: six 128x80 transparent PNGs + 256x240 atlas.
 * No external art, downloaded image, logos or redistributed typeface files.
 */
def lightBlueDecalOutput=layout.buildDirectory.dir('generated/cardboard-light-blue-decals')
tasks.register('generateLightBlueCardboardDecals') {
    inputs.property('light-blue-lost-airfield-original-revision',
                    '2026-11-06-six-distinct-aviation-prints-v1')
    outputs.dir(lightBlueDecalOutput)
    doLast {
        File dir=new File(lightBlueDecalOutput.get().asFile,
                'assets/cardboardstealth/textures/decals')
        dir.mkdirs()

        final int W=128,H=80
        final Color SKY=new Color(111,189,222)
        final Color WASH=new Color(175,222,230)
        final Color CLOUD=new Color(221,236,223)
        final Color PAPER=new Color(207,218,212)
        final Color DEEP=new Color(41,76,103)
        final Color INK=new Color(42,52,64)
        final Color STEEL=new Color(92,122,141)
        final Color RUST=new Color(166,94,65)
        final Color SIGNAL=new Color(230,163,87)
        final Color GREEN=new Color(90,154,133)
        final Color LILAC=new Color(138,148,185)
        final String[][] WORDS=[
            ['LAST','CONTROL','TOWER 02'],
            ['GROUND','BOUND','CARGO 19'],
            ['AIR','DROP','SUPPLY 05'],
            ['FINAL','CALL','NO FLIGHTS'],
            ['RUNWAY','DARK','STRIP 04'],
            ['BLACK','BOX','DATA LOST']
        ] as String[][]

        BufferedImage atlas=new BufferedImage(256,240,BufferedImage.TYPE_INT_ARGB)
        for(int id=0;id<6;id++) {
            java.util.Random rng=new java.util.Random(38192026L+15331L*id)
            BufferedImage img=new BufferedImage(W,H,BufferedImage.TYPE_INT_ARGB)
            def g=img.createGraphics()
            g.setRenderingHint(RenderingHints.KEY_ANTIALIASING,RenderingHints.VALUE_ANTIALIAS_OFF)
            g.setRenderingHint(RenderingHints.KEY_TEXT_ANTIALIASING,RenderingHints.VALUE_TEXT_ANTIALIAS_OFF)
            g.setRenderingHint(RenderingHints.KEY_FRACTIONALMETRICS,RenderingHints.VALUE_FRACTIONALMETRICS_OFF)

            // Genuine ragged, transparent handmade paper silhouette.
            Polygon paperEdge=new Polygon()
            for(int x=4;x<=123;x+=7)paperEdge.addPoint(x,4+rng.nextInt(7))
            paperEdge.addPoint(123,16)
            paperEdge.addPoint(121,30)
            paperEdge.addPoint(125,46)
            paperEdge.addPoint(123,62)
            for(int x=118;x>=6;x-=7)paperEdge.addPoint(x,71+rng.nextInt(6))
            paperEdge.addPoint(4,62)
            paperEdge.addPoint(6,47)
            paperEdge.addPoint(3,29)
            g.setColor(id%2==0?new Color(194,217,220):new Color(202,219,215))
            g.fillPolygon(paperEdge)
            g.setClip(paperEdge)
            // Old airport chart frame: sky tint, runway stripes, divider.
            g.setColor(DEEP);g.fillRect(6,9,116,4);g.fillRect(6,68,116,4)
            g.setColor(SKY);g.fillRect(8,13,111,3)
            g.setColor(id==3?DEEP:PAPER);g.fillRect(8,17,55,49)
            g.setColor(STEEL);g.fillRect(65,17,2,49)
            g.setColor(WASH)
            for(int y=22;y<65;y+=9)g.drawLine(9,y,61,y)
            for(int x=12;x<64;x+=11)g.drawLine(x,18,x,65)
            // Register imperfections, under printed subject.
            for(int j=0;j<910;j++) {
                int x=7+rng.nextInt(115), y=9+rng.nextInt(63)
                int a=7+rng.nextInt(56)
                g.setColor(j%4==0?new Color(35,75,106,a):
                           j%4==1?new Color(241,238,212,a):
                           j%4==2?new Color(108,179,207,a):
                           new Color(178,91,64,a))
                g.fillRect(x,y,1+(j%13==0?2:0),1)
            }

            switch(id) {
                case 0: { // Distinctive wide glass-headed airport control tower.
                    g.setColor(INK);g.fillRect(30,35,19,30)
                    g.setColor(STEEL);g.fillRect(33,35,13,29)
                    g.setColor(DEEP);g.fillRect(25,25,29,12)
                    g.setColor(SKY);g.fillRect(28,27,7,7)
                    g.fillRect(37,27,7,7);g.fillRect(46,27,6,7)
                    g.setColor(CLOUD);g.fillRect(23,23,33,3)
                    g.setColor(INK);g.fillPolygon([22,39,57] as int[],
                        [23,15,23] as int[],3)
                    g.setColor(RUST);g.fillRect(37,11,3,7)
                    g.setColor(SIGNAL);g.fillOval(36,9,6,6)
                    g.setColor(DEEP);g.fillRect(22,61,34,5)
                    g.setColor(WASH);g.drawArc(5,35,62,22,30,110)
                    break
                }
                case 1: { // A stationary old twin-propeller cargo plane, cracked apron.
                    g.setColor(STEEL)
                    g.fillPolygon([15,59,64,48] as int[],
                        [34,34,44,46] as int[],4)
                    g.setColor(DEEP);g.fillRoundRect(13,31,47,13,5,5)
                    g.setColor(CLOUD);g.fillRect(24,33,25,5)
                    g.setColor(INK)
                    g.fillPolygon([29,45,58,39] as int[],
                        [28,21,34,38] as int[],4)
                    g.setColor(SKY);g.fillRect(34,33,15,3)
                    g.setColor(RUST);g.fillRect(12,31,7,8)
                    g.setColor(INK);g.fillOval(21,31,12,12)
                    g.fillOval(48,31,12,12)
                    g.setColor(PAPER);g.fillOval(24,34,6,6)
                    g.fillOval(51,34,6,6)
                    g.setColor(STEEL);g.fillRect(21,47,40,3)
                    g.setColor(RUST);g.drawLine(8,60,65,60)
                    g.drawLine(23,55,42,55)
                    break
                }
                case 2: { // Full parachute canopy and suspended aid-supply crate.
                    g.setColor(SKY);g.fillArc(13,16,51,36,0,180)
                    g.setColor(CLOUD);g.fillArc(19,19,39,27,0,180)
                    g.setColor(DEEP);g.setStroke(new BasicStroke(2F))
                    g.drawArc(13,16,51,36,0,180)
                    g.drawLine(14,35,30,52)
                    g.drawLine(63,35,47,52)
                    g.drawLine(38,17,38,52)
                    g.setStroke(new BasicStroke(1F))
                    g.setColor(RUST);g.fillRect(26,52,25,13)
                    g.setColor(PAPER);g.fillRect(29,55,19,7)
                    g.setColor(DEEP);g.fillRect(34,55,8,7)
                    g.setColor(SIGNAL);g.fillRect(36,56,4,6)
                    g.setColor(INK);g.drawRect(26,51,25,13)
                    g.setColor(WASH)
                    for(int j=0;j<6;j++)g.fillRect(10+j*10,30+(j%2)*6,2,2)
                    break
                }
                case 3: { // Departure board: mechanical tiles and permanent cancellations.
                    g.setColor(INK);g.fillRoundRect(12,19,54,45,4,4)
                    g.setColor(DEEP);g.fillRect(15,23,47,37)
                    g.setColor(CLOUD);g.setFont(new Font('Monospaced',Font.BOLD,8))
                    g.drawString('FLIGHT',18,30)
                    g.setColor(SKY);g.fillRect(17,34,42,2)
                    g.setColor(PAPER);g.fillRect(18,39,14,4)
                    g.fillRect(18,47,14,4);g.fillRect(18,55,14,3)
                    g.setColor(LILAC);g.fillRect(35,39,23,4)
                    g.setColor(RUST);g.fillRect(35,47,23,4)
                    g.fillRect(35,55,23,3)
                    g.setColor(SIGNAL);g.fillRect(15,61,47,3)
                    g.setColor(INK);g.fillRect(20,65,35,2)
                    break
                }
                case 4: { // Runway centerline, perspective, dead lights and cracks.
                    g.setColor(DEEP);g.fillPolygon([17,50,65,3] as int[],
                        [63,20,20,63] as int[],4)
                    g.setColor(STEEL);g.fillPolygon([28,40,64,11] as int[],
                        [63,24,24,63] as int[],4)
                    g.setColor(PAPER)
                    g.fillRect(37,53,5,11)
                    g.fillRect(38,40,3,8)
                    g.fillRect(39,31,2,5)
                    g.setColor(SIGNAL)
                    for(int j=0;j<4;j++){
                        g.fillRect(13+j*4,55-j*8,4,3)
                        g.fillRect(61-j*4,55-j*8,4,3)
                    }
                    g.setColor(RUST);g.drawLine(22,61,34,52)
                    g.drawLine(34,52,30,45)
                    g.setColor(INK);g.fillRect(7,64,58,3)
                    break
                }
                case 5: { // Aviation 'black box' is in fact a vivid orange recorder.
                    g.setColor(INK);g.fillRoundRect(12,26,53,38,5,5)
                    g.setColor(RUST);g.fillRoundRect(16,29,44,29,4,4)
                    g.setColor(SIGNAL);g.fillRect(18,31,39,23)
                    g.setColor(PAPER);g.fillRect(23,34,21,6)
                    g.setColor(DEEP);g.fillRect(25,35,17,4)
                    g.setColor(INK)
                    for(int x=20;x<=55;x+=7)g.fillRect(x,46,4,6)
                    g.setColor(CLOUD);g.fillRect(21,55,34,2)
                    g.setColor(DEEP);g.setStroke(new BasicStroke(2F))
                    g.drawLine(58,38,64,30)
                    g.setStroke(new BasicStroke(1F))
                    g.setColor(WASH);g.fillOval(60,27,6,5)
                    g.setColor(INK);g.fillRect(21,59,35,5)
                    break
                }
            }

            // Independent print titles, cross-checked with localized inventory names.
            g.setColor(DEEP)
            g.setFont(new Font('SansSerif',Font.BOLD,WORDS[id][0].length()>6?11:15))
            g.drawString(WORDS[id][0],69,33)
            g.setColor(STEEL)
            g.setFont(new Font('SansSerif',Font.BOLD,WORDS[id][1].length()>6?11:13))
            g.drawString(WORDS[id][1],69,49)
            g.setColor(SKY);g.fillRect(69,54,47,3)
            g.setColor(INK);g.setFont(new Font('Monospaced',Font.BOLD,8))
            g.drawString(WORDS[id][2],69,65)

            // Faded printing and small actual alpha holes through the entire paper.
            for(int j=0;j<166;j++){
                int x=6+rng.nextInt(115), y=8+rng.nextInt(64)
                g.setColor(j%3==0?new Color(241,233,213,73):
                           j%3==1?new Color(36,74,107,48):
                           new Color(165,95,71,61))
                g.fillRect(x,y,1+(j%19==0?2:0),1)
            }
            g.setComposite(AlphaComposite.Clear)
            for(int j=0;j<103;j++){
                int x=6+rng.nextInt(115), y=9+rng.nextInt(63)
                g.fillRect(x,y,j%18==0?3:1,1)
            }
            g.setComposite(AlphaComposite.SrcOver)
            g.setClip(null);g.dispose()

            ImageIO.write(img,'png',new File(dir,'light_blue_'+id+'.png'))
            def atlasG=atlas.createGraphics()
            atlasG.drawImage(img,(id%2)*W,Math.floorDiv(id,2)*H,null)
            atlasG.dispose()
        }
        ImageIO.write(atlas,'png',new File(dir,'light_blue_atlas.png'))
        println 'Generated six original light blue lost-airfield prints and 256x240 atlas.'
    }
}
tasks.named('processResources') {
    dependsOn tasks.named('generateLightBlueCardboardDecals')
    from(lightBlueDecalOutput)
}
