import java.awt.image.BufferedImage
import java.awt.Color
import java.awt.Font
import java.awt.BasicStroke
import java.awt.RenderingHints
import javax.imageio.ImageIO

/**
 * Third wool carpet: GRAY. Original abandoned-industry stencils, dark
 * charcoal spray, chalk-white letters, faded red rejection paint, ripped
 * paper edges. High-detail 128x80 sprites, 2x3 atlas 256x240. No external art.
 */
def grayOut=layout.buildDirectory.dir('generated/cardboard-gray-decals')
tasks.register('generateGrayCardboardDecals') {
    inputs.property('gray-art-edition','2026-11-06-industrial-spray-v1')
    outputs.dir(grayOut)
    doLast {
        File dir=new File(grayOut.get().asFile,'assets/cardboardstealth/textures/decals')
        dir.mkdirs()
        final int W=128,H=80
        final Color CHARCOAL=new Color(35,38,41)
        final Color SOOT=new Color(66,67,66)
        final Color ASH=new Color(117,118,113)
        final Color OFF_WHITE=new Color(221,218,199)
        final Color PALE=new Color(196,193,177)
        final Color RED=new Color(150,69,62)
        final Color OXIDE=new Color(124,97,76)
        BufferedImage atlas=new BufferedImage(256,240,BufferedImage.TYPE_INT_ARGB)

        for(int id=0;id<6;id++) {
            java.util.Random rng=new java.util.Random(4161007L+3199L*id)
            BufferedImage img=new BufferedImage(W,H,BufferedImage.TYPE_INT_ARGB)
            java.awt.Graphics2D g=img.createGraphics()
            g.setRenderingHint(RenderingHints.KEY_ANTIALIASING,RenderingHints.VALUE_ANTIALIAS_OFF)
            g.setRenderingHint(RenderingHints.KEY_TEXT_ANTIALIASING,RenderingHints.VALUE_TEXT_ANTIALIAS_OFF)
            g.setRenderingHint(RenderingHints.KEY_FRACTIONALMETRICS,RenderingHints.VALUE_FRACTIONALMETRICS_OFF)

            // Physical torn-paper silhouette, pixel corners missing rather
            // than an artificial fully filled rectangle.
            for(int y=5;y<76;y++) for(int x=4;x<124;x++) {
                boolean corner=x+y<20 || x+80-y<20 ||
                        128-x+y<20 || 128-x+80-y<20
                boolean edge=(x<9 || x>118 || y<10 || y>70)
                if(corner && rng.nextInt(3)<2) continue
                if(edge && rng.nextInt(11)<2) continue
                int grain=rng.nextInt(19)-9
                int base=id==4?96:(id==3?170:188)
                int v=Math.min(255,Math.max(0,base+grain-(x<9||x>118?16:0)))
                img.setRGB(x,y,new Color(v,Math.max(0,v-2),Math.max(0,v-6)).getRGB())
            }
            g.setClip(4,5,120,71)
            for(int n=0;n<560;n++) {
                int x=6+rng.nextInt(115),y=8+rng.nextInt(65)
                int alpha=17+rng.nextInt(55)
                g.setColor(n%3==0?new Color(237,228,204,alpha):new Color(41,37,35,alpha))
                g.fillRect(x,y,1+rng.nextInt(3),1+rng.nextInt(2))
            }

            switch(id) {
                case 0:
                    // Restricted zone: heavy military stencil, chipped crossbars.
                    g.setColor(CHARCOAL);g.fillRect(10,13,109,43)
                    g.setColor(OFF_WHITE);g.setFont(new Font('Monospaced',Font.BOLD,18))
                    g.drawString('RESTRICTED',14,31)
                    g.setFont(new Font('Monospaced',Font.BOLD,13))
                    g.drawString('ZONE  06',22,47)
                    g.setColor(RED);g.fillRect(12,58,101,4)
                    for(int x=16;x<109;x+=16) {
                        g.setColor(SOOT);g.fillRect(x,63,8,4)
                    }
                    break
                case 1:
                    // Bunker No.13, round hand-stamped seal.
                    g.setColor(SOOT);g.setStroke(new BasicStroke(3F))
                    g.drawOval(13,9,55,57);g.drawOval(18,14,45,47)
                    g.setStroke(new BasicStroke(1F))
                    g.setFont(new Font('Monospaced',Font.BOLD,25));g.drawString('13',24,48)
                    g.setColor(CHARCOAL);g.fillRect(72,17,44,32)
                    g.setColor(OFF_WHITE);g.setFont(new Font('Monospaced',Font.BOLD,11))
                    g.drawString('BUNKER',73,32);g.drawString('SEALED',73,44)
                    g.setColor(RED);g.fillRect(74,53,39,5)
                    g.setColor(CHARCOAL);g.setFont(new Font('Monospaced',Font.BOLD,9))
                    g.drawString('ACCESS DENIED',22,71)
                    break
                case 2:
                    // Repainted crate ID: overtyped stencil and oxidized note.
                    g.setColor(CHARCOAL);g.fillRect(10,12,105,16)
                    g.setColor(OFF_WHITE);g.setFont(new Font('Monospaced',Font.BOLD,12))
                    g.drawString('CRATE ID // 088',13,24)
                    g.setColor(SOOT);g.setFont(new Font('Monospaced',Font.BOLD,29))
                    g.drawString('K-308',13,59)
                    g.setColor(RED);g.drawLine(15,48,110,55);g.drawLine(15,49,110,56)
                    g.setColor(CHARCOAL);g.setFont(new Font('Monospaced',Font.BOLD,9))
                    g.drawString('OVERRIDE / 46-B',18,71)
                    break
                case 3:
                    // Rejected shipment: red X across black stencilled letters.
                    g.setColor(CHARCOAL);g.setFont(new Font('Monospaced',Font.BOLD,20))
                    g.drawString('REJECTED',11,31)
                    g.setFont(new Font('Monospaced',Font.BOLD,11));g.drawString('NOT FOR ISSUE',14,64)
                    g.setColor(RED);g.setStroke(new BasicStroke(6F))
                    g.drawLine(20,36,105,56);g.drawLine(104,35,21,57)
                    g.setStroke(new BasicStroke(1F))
                    g.setColor(CHARCOAL);g.drawRect(9,10,108,59)
                    break
                case 4:
                    // NO FUTURE / STAY HUMAN, bold street tag and drips,
                    // strong hip-hop graffiti influence without external logos.
                    g.setColor(CHARCOAL);g.fillRect(10,13,105,49)
                    g.setColor(OFF_WHITE);g.setFont(new Font('Monospaced',Font.BOLD,18))
                    g.drawString('NO FUTURE',14,34)
                    g.setFont(new Font('Monospaced',Font.BOLD,13))
                    g.drawString('STAY HUMAN',17,52)
                    for(int x : [17,42,65,99])g.fillRect(x,61,2,3+rng.nextInt(7))
                    g.setColor(RED);g.fillRect(9,7,29,5);g.fillRect(99,63,19,4)
                    g.setColor(OFF_WHITE);g.drawLine(108,8,118,8)
                    g.drawLine(118,8,113,5);g.drawLine(118,8,113,11)
                    break
                case 5:
                    // Abandoned mill scrap wheel and two-tone warehouse stamp.
                    g.setColor(CHARCOAL);g.fillRect(10,11,108,15)
                    g.setColor(OFF_WHITE);g.setFont(new Font('Monospaced',Font.BOLD,15))
                    g.drawString('MILL / 09',15,23)
                    g.setColor(SOOT);g.setStroke(new BasicStroke(4F))
                    g.drawOval(12,32,38,34);g.drawLine(31,30,31,68);g.drawLine(10,49,52,49)
                    g.setStroke(new BasicStroke(1F))
                    g.setColor(CHARCOAL);g.setFont(new Font('Monospaced',Font.BOLD,15))
                    g.drawString('SCRAP',57,44)
                    g.setFont(new Font('Monospaced',Font.BOLD,12));g.drawString('ONLY',64,60)
                    g.setColor(RED);g.fillRect(56,65,52,4)
                    break
            }

            // Crisp scratches, clipped ink and thin salt corrosion marks.
            for(int n=0;n<95;n++){
                int x=8+rng.nextInt(112),y=10+rng.nextInt(60)
                g.setColor(new Color(184,177,162,45+rng.nextInt(50)))
                g.fillRect(x,y,1+(n%9==0?2:0),1)
            }
            g.setClip(null)
            g.dispose()
            ImageIO.write(img,'png',new File(dir,'gray_'+id+'.png'))
            java.awt.Graphics2D cell=atlas.createGraphics()
            cell.drawImage(img,(id%2)*128,(int)(id/2)*80,null)
            cell.dispose()
        }
        ImageIO.write(atlas,'png',new File(dir,'gray_atlas.png'))
        println 'Generated 6 gray industrial/street decals and 256x240 transparent atlas.'
    }
}
tasks.named('processResources') {
    dependsOn tasks.named('generateGrayCardboardDecals')
    from(grayOut)
}
