import java.awt.image.BufferedImage
import java.awt.Color
import java.awt.Font
import java.awt.BasicStroke
import java.awt.Polygon
import java.awt.AlphaComposite
import java.awt.RenderingHints
import javax.imageio.ImageIO

/**
 * Carpet #9 PINK: six ORIGINAL illustrations of wasteland corner-shop culture.
 * Each has its own recognisable central object and period street-print styling,
 * not a recolor of the earlier eight carpet families. No licensed characters,
 * external pictures, sound assets, or redistributable font files.
 *
 * 128x80 transparent art ×6, and a matching 256x240 2-column/3-row atlas.
 */
def pinkDecalOutput=layout.buildDirectory.dir('generated/cardboard-pink-decals')
tasks.register('generatePinkCardboardDecals') {
    inputs.property('original-pink-street-art-revision','2026-11-06-six-street-culture-prints-v1')
    outputs.dir(pinkDecalOutput)
    doLast {
        File dir=new File(pinkDecalOutput.get().asFile,
                'assets/cardboardstealth/textures/decals')
        dir.mkdirs()
        final int W=128,H=80
        final Color PAPER=new Color(247,219,207)
        final Color ROSE=new Color(238,113,148)
        final Color FUCHSIA=new Color(181,59,113)
        final Color BURGUNDY=new Color(97,50,78)
        final Color INK=new Color(45,46,61)
        final Color MINT=new Color(85,188,162)
        final Color VANILLA=new Color(254,235,189)
        final Color LAVENDER=new Color(168,128,189)
        final Color GOLD=new Color(240,179,93)
        final Color DUST=new Color(166,122,122)
        final String[][] TITLES=[
            ['NIGHT','NOODLES','EAT HOT'],
            ['SODA','LAST CAN','BERRY FIZZ'],
            ['ARCADE','GAME OVER','ONE MORE'],
            ['LOST CAT','FOUND?','CALL HOME'],
            ['MIXTAPE','SIDE B','PLAY ON'],
            ['MEND','HEART','STAY SOFT']
        ] as String[][]
        BufferedImage atlas=new BufferedImage(256,240,BufferedImage.TYPE_INT_ARGB)
        for(int id=0;id<6;id++){
            java.util.Random rnd=new java.util.Random(20261106L+15227L*id)
            BufferedImage img=new BufferedImage(W,H,BufferedImage.TYPE_INT_ARGB)
            def g=img.createGraphics()
            g.setRenderingHint(RenderingHints.KEY_ANTIALIASING,RenderingHints.VALUE_ANTIALIAS_OFF)
            g.setRenderingHint(RenderingHints.KEY_TEXT_ANTIALIASING,RenderingHints.VALUE_TEXT_ANTIALIAS_OFF)
            g.setRenderingHint(RenderingHints.KEY_FRACTIONALMETRICS,RenderingHints.VALUE_FRACTIONALMETRICS_OFF)
            // Each corner is unevenly hand-torn; the bounding box stays transparent.
            Polygon border=new Polygon()
            for(int x=5;x<=122;x+=7)border.addPoint(x,4+rnd.nextInt(6))
            border.addPoint(122,17);border.addPoint(125,32);border.addPoint(122,49)
            border.addPoint(123,63)
            for(int x=118;x>=6;x-=7)border.addPoint(x,70+rnd.nextInt(6))
            border.addPoint(4,62);border.addPoint(6,43);border.addPoint(3,25)
            g.setColor(id==2?new Color(73,54,91):id==4?new Color(77,61,91):PAPER)
            g.fillPolygon(border)
            g.setClip(border)
            // Offset cheap 2030s shop-printer registration and scuffed dye.
            g.setColor(id==2||id==4?LAVENDER:FUCHSIA)
            g.fillRect(6,9,116,4);g.fillRect(6,68,116,3)
            g.setColor(id==2||id==4?BURGUNDY:ROSE)
            g.fillRect(7,13,55,53)
            g.setColor(id==2||id==4?MINT:VANILLA)
            g.fillRect(64,13,2,53)
            for(int i=0;i<850;i++){
                int x=6+rnd.nextInt(116),y=10+rnd.nextInt(61)
                int alpha=7+rnd.nextInt(53)
                g.setColor(i%4==0?new Color(62,44,63,alpha):
                           i%4==1?new Color(248,230,202,alpha):
                           i%4==2?new Color(214,88,120,alpha):
                           new Color(132,93,145,alpha))
                g.fillRect(x,y,1+(i%11==0?2:0),1)
            }
            switch(id){
                case 0: { // Wasteland noodle stall: bowl, sticks and steam.
                    g.setColor(VANILLA)
                    g.fillArc(13,38,47,28,180,180)
                    g.setColor(BURGUNDY)
                    g.setStroke(new BasicStroke(3F))
                    g.drawArc(13,36,47,33,180,180)
                    g.setStroke(new BasicStroke(1F))
                    g.setColor(GOLD)
                    for(int i=0;i<5;i++)g.drawArc(17+i*7,39,11,6,0,180)
                    g.setColor(INK)
                    g.setStroke(new BasicStroke(3F))
                    g.drawLine(22,21,51,42);g.drawLine(31,17,57,40)
                    g.setStroke(new BasicStroke(1F))
                    g.setColor(VANILLA)
                    g.drawArc(23,17,9,21,5,155);g.drawArc(38,16,7,21,15,160)
                    g.setColor(MINT);g.fillRect(27,55,21,3)
                    break
                }
                case 1: { // Strawberry soda vending-machine panel.
                    g.setColor(INK);g.fillRoundRect(17,19,42,48,4,4)
                    g.setColor(VANILLA);g.fillRect(21,23,34,22)
                    g.setColor(MINT)
                    g.fillRect(25,26,6,15);g.fillRect(36,26,6,15)
                    g.setColor(ROSE);g.fillRect(47,26,5,15)
                    g.setColor(FUCHSIA);g.fillRect(26,30,4,6)
                    g.setColor(INK);g.drawRect(24,25,8,17);g.drawRect(35,25,8,17)
                    g.setColor(LAVENDER);g.fillRect(24,50,30,11)
                    g.setColor(GOLD);g.fillOval(46,52,5,5)
                    g.setColor(VANILLA);g.fillRect(27,61,20,2)
                    g.setColor(ROSE);g.fillOval(12,42,7,9)
                    break
                }
                case 2: { // A tiny arcade cabinet with glowing screen and joystick.
                    g.setColor(INK)
                    g.fillPolygon([21,50,56,60,55,28] as int[],
                                  [21,21,34,64,66,62] as int[],6)
                    g.setColor(MINT);g.fillRect(25,27,27,23)
                    g.setColor(BURGUNDY);g.fillRect(29,31,18,14)
                    g.setColor(GOLD);g.fillRect(31,34,5,5);g.fillRect(41,39,4,4)
                    g.setColor(ROSE);g.fillRect(36,32,5,4)
                    g.setColor(VANILLA);g.fillRect(26,53,25,7)
                    g.setColor(INK);g.fillOval(36,51,6,6);g.fillRect(38,47,2,6)
                    g.setColor(ROSE);g.fillOval(48,54,4,4)
                    break
                }
                case 3: { // A lost-cat community notice with unique cat portrait.
                    g.setColor(VANILLA);g.fillRoundRect(13,17,47,49,2,2)
                    g.setColor(MINT);g.fillRect(19,22,36,4)
                    g.setColor(INK)
                    g.fillPolygon([20,27,28,37] as int[],[34,26,31,40] as int[],4)
                    g.fillPolygon([39,51,54,46] as int[],[31,25,44,39] as int[],4)
                    g.fillOval(22,32,30,27)
                    g.setColor(ROSE);g.fillRect(27,44,5,3);g.fillRect(43,44,5,3)
                    g.setColor(MINT);g.fillRect(32,45,6,3);g.fillRect(39,45,5,3)
                    g.setColor(VANILLA);g.fillRect(33,51,9,2)
                    g.setColor(BURGUNDY)
                    g.drawLine(21,51,31,52);g.drawLine(43,52,54,51)
                    g.setColor(DUST);g.drawRect(15,19,42,44)
                    break
                }
                case 4: { // Analogue cassette tape, two readable spools.
                    g.setColor(INK);g.fillRoundRect(10,25,52,34,4,4)
                    g.setColor(ROSE);g.fillRect(14,28,45,23)
                    g.setColor(VANILLA);g.fillRect(16,31,41,14)
                    g.setColor(BURGUNDY);g.fillOval(20,32,15,13);g.fillOval(39,32,15,13)
                    g.setColor(MINT);g.fillOval(24,36,7,6);g.fillOval(43,36,7,6)
                    g.setColor(INK);g.fillOval(26,38,3,3);g.fillOval(45,38,3,3)
                    g.setColor(GOLD);g.fillRect(31,38,11,2)
                    g.setColor(LAVENDER);g.fillRect(17,53,38,3)
                    g.setColor(VANILLA);g.fillRect(18,27,23,2)
                    break
                }
                case 5: { // Handstitched broken heart patch and repair needle.
                    g.setColor(BURGUNDY);g.fillOval(15,21,25,30)
                    g.fillOval(34,21,25,30)
                    g.fillPolygon([15,37,59] as int[],[36,62,36] as int[],3)
                    g.setColor(ROSE);g.fillOval(19,24,18,24)
                    g.fillOval(37,24,18,24)
                    g.fillPolygon([20,37,54] as int[],[39,57,39] as int[],3)
                    g.setColor(VANILLA);g.setStroke(new BasicStroke(2F))
                    g.drawLine(29,31,44,48);g.drawLine(38,29,33,35)
                    g.drawLine(38,40,42,35);g.drawLine(36,46,41,42)
                    g.setStroke(new BasicStroke(1F))
                    g.setColor(MINT)
                    for(int i=0;i<7;i++)g.fillRect(20+i*5,53+i%2,2,2)
                    g.setColor(INK);g.drawLine(49,18,58,29)
                    g.setColor(GOLD);g.fillOval(49,16,4,4)
                    break
                }
            }
            // Two readable poster lines; six posters have unique typography.
            g.setColor(id==2||id==4?VANILLA:BURGUNDY)
            g.setFont(new Font('SansSerif',Font.BOLD,TITLES[id][0].length()>6?11:14))
            g.drawString(TITLES[id][0],69,33)
            g.setColor(id==2||id==4?ROSE:FUCHSIA)
            g.setFont(new Font('SansSerif',Font.BOLD,TITLES[id][1].length()>7?9:12))
            g.drawString(TITLES[id][1],69,49)
            g.setColor(MINT);g.fillRect(69,54,45,3)
            g.setColor(id==2||id==4?VANILLA:INK)
            g.setFont(new Font('Monospaced',Font.BOLD,8))
            g.drawString(TITLES[id][2],69,65)
            // Faded/scratched ink and pinholes, without flattening characters.
            for(int j=0;j<150;j++){
                int x=5+rnd.nextInt(119),y=7+rnd.nextInt(67)
                g.setColor(j%3==0?new Color(250,233,202,76):
                           j%3==1?new Color(42,44,59,44):
                           new Color(181,69,110,65))
                g.fillRect(x,y,1+(j%21==0?2:0),1)
            }
            g.setComposite(AlphaComposite.Clear)
            for(int j=0;j<96;j++){
                int x=6+rnd.nextInt(115),y=9+rnd.nextInt(63)
                g.fillRect(x,y,j%17==0?3:1,1)
            }
            g.setComposite(AlphaComposite.SrcOver)
            g.setClip(null);g.dispose()
            ImageIO.write(img,'png',new File(dir,'pink_'+id+'.png'))
            def out=atlas.createGraphics()
            out.drawImage(img,(id%2)*W,Math.floorDiv(id,2)*H,null)
            out.dispose()
        }
        ImageIO.write(atlas,'png',new File(dir,'pink_atlas.png'))
        println 'Generated six original pink wasteland street-culture artworks and 256x240 atlas.'
    }
}
tasks.named('processResources') {
    dependsOn tasks.named('generatePinkCardboardDecals')
    from(pinkDecalOutput)
}
