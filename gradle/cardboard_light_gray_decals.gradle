import java.awt.image.BufferedImage
import java.awt.Color
import java.awt.Font
import java.awt.Polygon
import java.awt.BasicStroke
import java.awt.RenderingHints
import javax.imageio.ImageIO

/**
 * Second dedicated decal family: LIGHT_GRAY wool carpet.
 * Original 128x80 pixel artwork is drawn reproducibly from these sources.
 * Editorial art direction: torn post-collapse warehouse inventories, forklift
 * bay stencils, handwritten crate manifest, worn tin-grey shipping tape.
 * No external assets or remotely fetched images, and no blended font edges.
 */
def lightGrayOut = layout.buildDirectory.dir("generated/cardboard-light-gray-decals")
tasks.register("generateLightGrayCardboardDecals") {
    inputs.property("light-gray-art-edition","2026-11-06-warehouse-stencils-v1")
    outputs.dir(lightGrayOut)
    doLast {
        File dir = new File(lightGrayOut.get().asFile,
                "assets/cardboardstealth/textures/decals")
        dir.mkdirs()
        final int W=128, H=80
        final Color INK=new Color(43,47,51)
        final Color FADE=new Color(114,121,124)
        final Color GRAY=new Color(181,185,179)
        final Color PALE=new Color(214,212,200)
        final Color PAPER=new Color(194,196,189)
        final Color SILVER=new Color(157,162,158)
        final Color RUST=new Color(148,75,65)
        final Color OXIDE=new Color(112,115,89)
        final Color WHITE=new Color(238,232,218)
        BufferedImage atlas=new BufferedImage(256,240,BufferedImage.TYPE_INT_ARGB)

        for(int id=0;id<6;id++){
            BufferedImage img=new BufferedImage(W,H,BufferedImage.TYPE_INT_ARGB)
            java.awt.Graphics2D g=img.createGraphics()
            g.setRenderingHint(RenderingHints.KEY_ANTIALIASING,RenderingHints.VALUE_ANTIALIAS_OFF)
            g.setRenderingHint(RenderingHints.KEY_TEXT_ANTIALIASING,RenderingHints.VALUE_TEXT_ANTIALIAS_OFF)
            g.setRenderingHint(RenderingHints.KEY_FRACTIONALMETRICS,RenderingHints.VALUE_FRACTIONALMETRICS_OFF)
            java.util.Random rng=new java.util.Random(620311L+7777*id)

            // Each art piece has its own silhouette: labels, bent tape, hanging
            // warehouse tags, or a shredded form. Cuts reveal cardboard behind.
            int[] edgeTop=new int[W],edgeBottom=new int[W]
            for(int x=0;x<W;x++){
                int major=(x<=2||x>=125)?4:0
                edgeTop[x]=4 + (x%19==0?3:0)+(x%13==0?2:0)+major
                edgeBottom[x]=75 - (x%17==0?3:0)-(x%11==0?1:0)-major
            }
            for(int x=3;x<=124;x++)for(int y=edgeTop[x];y<=edgeBottom[x];y++){
                int grain=rng.nextInt(17)-8
                int stain=((x<12||x>113||y<10||y>70) ? -12:0)
                if(id==2)stain-=11 // aged silver tamper-strip
                int rr=Math.max(0,Math.min(255,PAPER.getRed()+grain+stain))
                int gg=Math.max(0,Math.min(255,PAPER.getGreen()+grain+stain))
                int bb=Math.max(0,Math.min(255,PAPER.getBlue()+grain+stain))
                img.setRGB(x,y,new Color(rr,gg,bb).getRGB())
            }
            g.setClip(3,3,122,74)

            // Handmade light-grey recycled paper: abrasion spots and flecks,
            // never smooth airbrushed grunge, keep 1px pixel edges.
            for(int j=0;j<470;j++){
                int x=5+rng.nextInt(119),y=6+rng.nextInt(68)
                g.setColor(j%4==0?new Color(92,82,67,58):new Color(240,235,218,54))
                g.fillRect(x,y,1+rng.nextInt(3),1+rng.nextInt(2))
            }
            g.setStroke(new BasicStroke(1F))
            g.setColor(FADE)
            if(id!=2)g.drawRect(9,9,110,59)

            switch(id){
                case 0: { // Back-alley salvage warehouse BAY stencil
                    g.setColor(INK);g.fillRect(10,11,107,17)
                    g.setColor(PALE);g.setFont(new Font("Monospaced",Font.BOLD,15))
                    g.drawString("STORAGE BAY",15,24)
                    g.setColor(FADE);g.setFont(new Font("Monospaced",Font.BOLD,11))
                    g.drawString("DEPOT / SECTION",14,43)
                    g.setColor(INK);g.setFont(new Font("Monospaced",Font.BOLD,22))
                    g.drawString("04 - B",15,64)
                    g.setColor(RUST);g.fillRect(94,45,4,22);g.fillRect(103,45,4,22)
                    break
                }
                case 1: { // Hand-corrected old lot number and handwritten checks
                    g.setColor(INK);g.setFont(new Font("Monospaced",Font.BOLD,12))
                    g.drawString("LOT No. 0-173",12,23)
                    g.setColor(FADE);g.drawLine(10,27,115,27)
                    g.setColor(INK);g.setFont(new Font("Monospaced",Font.BOLD,20))
                    g.drawString("H-0194",16,48)
                    g.setColor(RUST);g.drawLine(19,39,100,48);g.drawLine(19,40,100,49)
                    g.setColor(INK);g.setFont(new Font("Monospaced",Font.BOLD,10))
                    g.drawString("RECOUNT",13,63)
                    g.setColor(OXIDE);g.drawOval(78,51,30,16)
                    g.drawString("OK",84,63)
                    break
                }
                case 2: { // Shredded cargo seal / stencilled grey tape
                    g.setColor(new Color(116,125,126));g.fillRect(8,14,112,17)
                    g.setColor(WHITE);g.setFont(new Font("Monospaced",Font.BOLD,15))
                    g.drawString("DO NOT BREAK",11,27)
                    g.setColor(INK);g.fillRect(12,37,104,3)
                    g.setFont(new Font("Monospaced",Font.BOLD,22))
                    g.drawString("SEAL 07",11,61)
                    g.setColor(RUST);g.fillRect(12,65,92,4)
                    for(int x=10;x<120;x+=7)g.drawLine(x,13,x+3,18)
                    break
                }
                case 3: { // Return-to-depot label, reclaimed delivery parcel
                    g.setColor(INK);g.setFont(new Font("Monospaced",Font.BOLD,14))
                    g.drawString("RETURN TO",15,25)
                    g.drawString("DEPOT 06",15,42)
                    g.setColor(RUST);g.fillRect(11,49,106,3)
                    g.setColor(INK);g.setFont(new Font("Monospaced",Font.BOLD,11))
                    g.drawString("RMA-183",15,67)
                    g.setStroke(new BasicStroke(3F))
                    g.drawLine(101,60,111,60);g.drawLine(111,60,111,44)
                    g.drawLine(111,44,106,50);g.drawLine(111,44,117,50)
                    g.setStroke(new BasicStroke(1F))
                    break
                }
                case 4: { // Stack limit instruction painted with a cracked stencil
                    g.setColor(OXIDE);g.fillRect(11,11,104,18)
                    g.setColor(PALE);g.setFont(new Font("Monospaced",Font.BOLD,13))
                    g.drawString("STACK LIMIT",17,24)
                    g.setColor(INK);g.setFont(new Font("Monospaced",Font.BOLD,30))
                    g.drawString("03",17,61)
                    g.setFont(new Font("Monospaced",Font.BOLD,10))
                    g.drawString("MAX",21,70)
                    g.setStroke(new BasicStroke(3F))
                    for (int x=81;x<=104;x+=17){
                        g.drawLine(x,63,x,42);g.drawLine(x,42,x-6,49);g.drawLine(x,42,x+6,49)
                    }
                    g.setStroke(new BasicStroke(1F))
                    break
                }
                case 5: { // Paper field manifest, ruled boxes, large scrawled count
                    g.setColor(INK);g.fillRect(10,10,109,14)
                    g.setColor(PALE);g.setFont(new Font("Monospaced",Font.BOLD,12))
                    g.drawString("FIELD MANIFEST",13,22)
                    g.setColor(FADE);g.drawLine(10,33,119,33);g.drawLine(10,47,119,47)
                    g.drawLine(64,33,64,62)
                    g.setColor(INK);g.setFont(new Font("Monospaced",Font.BOLD,10))
                    g.drawString("BOX 06/09",13,44)
                    g.drawString("AUDIT",76,44)
                    g.drawString("2 OF 3",13,60)
                    g.setColor(OXIDE);g.drawRect(79,51,9,9);g.drawRect(93,51,9,9)
                    g.drawLine(79,54,84,59);g.drawLine(84,59,89,49)
                    break
                }
            }

            // Chipped stamp edges, folded corner, pencil grease and salt.
            if (id%2==0) {
                g.setColor(new Color(143,111,80,165))
                g.fillRect(18,3,18,8)
                g.setColor(new Color(234,216,184,140))
                g.fillRect(20,4,13,6)
            } else {
                g.setColor(new Color(174,146,112,150))
                g.fillRect(92,3,17,8)
            }
            // Hairline creases and corrosion freckles, deliberately kept away
            // from central legibility areas more often than not.
            g.setColor(new Color(98,93,81,65))
            g.drawLine(11,67,40,72)
            for(int j=0;j<55;j++){
                int x=6+rng.nextInt(115),y=6+rng.nextInt(69)
                g.setColor(new Color(73,64,58,20+rng.nextInt(55)))
                g.fillRect(x,y,1+(j%3==0?2:0),1)
            }
            g.setClip(null)
            g.dispose()

            File out=new File(dir,"light_gray_"+id+".png")
            ImageIO.write(img,"png",out)
            java.awt.Graphics2D atlasG=atlas.createGraphics()
            atlasG.drawImage(img,(id%2)*128,(int)(id/2)*80,null)
            atlasG.dispose()
        }
        ImageIO.write(atlas,"png",new File(dir,"light_gray_atlas.png"))
        println "Generated 6 original light-gray carpet warehouse labels (128x80) and 256x240 atlas."
    }
}

tasks.named("processResources") {
    dependsOn tasks.named("generateLightGrayCardboardDecals")
    from(lightGrayOut)
}
