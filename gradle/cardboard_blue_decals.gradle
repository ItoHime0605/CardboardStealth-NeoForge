import java.awt.image.BufferedImage
import java.awt.Color
import java.awt.Font
import java.awt.BasicStroke
import java.awt.Polygon
import java.awt.AlphaComposite
import java.awt.RenderingHints
import javax.imageio.ImageIO

/**
 * BLUE family #13: six original abandoned-harbor/sea-route poster engravings.
 *
 * Unique central illustrations: coastal lighthouse, sunken trawler,
 * battered navigation buoy, dockside cargo crane, sea-chart route, and
 * antique sealed diving helmet. Each is individually constructed using
 * Java2D primitives and worn screenprinting, not copies or recolors.
 *
 * Six transparent 128x80 PNGs, one 256x240 atlas; no external images/fonts.
 */
def blueDecalOutput=layout.buildDirectory.dir('generated/cardboard-blue-decals')
tasks.register('generateBlueCardboardDecals') {
    inputs.property('blue-lost-harbor-engraving-revision','2026-11-06-six-original-naval-v1')
    outputs.dir(blueDecalOutput)
    doLast {
        File dir=new File(blueDecalOutput.get().asFile,
                'assets/cardboardstealth/textures/decals')
        dir.mkdirs()
        final int W=128,H=80
        final Color NAVY=new Color(32,55,87)
        final Color BLUE=new Color(59,102,163)
        final Color DEEP=new Color(40,73,117)
        final Color SEA=new Color(83,149,176)
        final Color FOAM=new Color(195,215,208)
        final Color PAPER=new Color(212,210,184)
        final Color CREAM=new Color(236,224,188)
        final Color RUST=new Color(161,85,60)
        final Color LAMP=new Color(236,178,90)
        final Color INK=new Color(45,52,62)
        final Color[] BGS=[
            new Color(177,197,197),new Color(187,192,191),
            new Color(184,201,201),new Color(191,203,199),
            new Color(195,206,199),new Color(182,196,198)
        ] as Color[]
        final String[][] WORDS=[
            ['LAST','BEACON','LIGHT NO.7'],
            ['WRECK','MARKED','LOW TIDE'],
            ['SAFE','CHANNEL','BUOY 13'],
            ['DOCK','CLOSED','CRANE 04'],
            ['NO','RETURN','DEAD ROUTE'],
            ['DEEP','SALVAGE','DIVE SUIT']
        ] as String[][]
        BufferedImage atlas=new BufferedImage(256,240,BufferedImage.TYPE_INT_ARGB)
        for(int id=0;id<6;id++) {
            java.util.Random rng=new java.util.Random(203711L+17929L*id)
            BufferedImage img=new BufferedImage(W,H,BufferedImage.TYPE_INT_ARGB)
            def g=img.createGraphics()
            g.setRenderingHint(RenderingHints.KEY_ANTIALIASING,RenderingHints.VALUE_ANTIALIAS_OFF)
            g.setRenderingHint(RenderingHints.KEY_TEXT_ANTIALIASING,RenderingHints.VALUE_TEXT_ANTIALIAS_OFF)
            g.setRenderingHint(RenderingHints.KEY_FRACTIONALMETRICS,RenderingHints.VALUE_FRACTIONALMETRICS_OFF)

            // Faded sea-blue bulletin paper with irregular ripped silhouette.
            Polygon torn=new Polygon()
            for(int x=5;x<=123;x+=7)torn.addPoint(x,4+rng.nextInt(6))
            torn.addPoint(124,18);torn.addPoint(121,31)
            torn.addPoint(125,46);torn.addPoint(123,63)
            for(int x=118;x>=7;x-=7)torn.addPoint(x,70+rng.nextInt(6))
            torn.addPoint(4,62);torn.addPoint(7,45);torn.addPoint(3,28)
            g.setColor(BGS[id]);g.fillPolygon(torn)
            g.setClip(torn)
            g.setColor(NAVY);g.fillRect(6,9,116,4);g.fillRect(6,68,116,4)
            g.setColor(SEA);g.fillRect(8,13,112,3)
            g.setColor(PAPER);g.fillRect(8,17,55,49)
            g.setColor(BLUE);g.fillRect(65,18,2,48)
            for(int y=22;y<65;y+=8) {
                g.setColor(new Color(153,183,191,120));g.drawLine(9,y,62,y)
            }
            // Old silkscreen pigment and salt spray, beneath main silhouette.
            for(int j=0;j<900;j++) {
                int x=7+rng.nextInt(115),y=9+rng.nextInt(63)
                int a=7+rng.nextInt(56)
                g.setColor(j%4==0?new Color(39,62,92,a):
                           j%4==1?new Color(244,228,196,a):
                           j%4==2?new Color(70,124,170,a):
                           new Color(172,100,67,a))
                g.fillRect(x,y,1+(j%17==0?2:0),1)
            }
            switch(id) {
                case 0: { // Coastal lighthouse, beacon rays, broken sea wall.
                    g.setColor(NAVY);g.fillRect(21,35,34,30)
                    g.setColor(CREAM);g.fillPolygon([24,52,48,27] as int[],
                        [34,34,62,62] as int[],4)
                    g.setColor(BLUE);g.fillRect(28,37,20,4);g.fillRect(28,50,20,4)
                    g.setColor(NAVY);g.fillRect(20,30,34,7)
                    g.setColor(RUST);g.fillPolygon([18,37,57] as int[],
                        [30,20,30] as int[],3)
                    g.setColor(SEA);g.fillRect(26,22,23,7)
                    g.setColor(LAMP);g.fillRect(30,23,15,5)
                    g.setColor(NAVY);g.fillRect(28,19,19,3)
                    g.setColor(LAMP)
                    g.fillPolygon([50,63,50] as int[],[22,15,31] as int[],3)
                    g.setColor(DEEP);g.fillRect(17,60,42,6)
                    g.setColor(FOAM);g.drawArc(8,56,56,12,0,160)
                    break
                }
                case 1: { // Tilted wrecked fishing vessel with waves, broken mast.
                    g.setColor(INK);g.fillPolygon([10,61,50,61,41,18] as int[],
                        [39,40,53,59,64,59] as int[],6)
                    g.setColor(RUST);g.fillPolygon([14,59,49,21] as int[],
                        [41,43,54,55] as int[],4)
                    g.setColor(CREAM);g.fillRect(28,28,24,15)
                    g.setColor(NAVY);g.fillRect(33,31,6,6);g.fillRect(44,31,5,6)
                    g.setColor(INK);g.setStroke(new BasicStroke(3F))
                    g.drawLine(40,30,33,13);g.drawLine(32,15,46,27)
                    g.setStroke(new BasicStroke(1F))
                    g.setColor(PAPER);g.fillPolygon([33,28,21] as int[],
                        [15,34,30] as int[],3)
                    g.setColor(SEA)
                    for(int y=54;y<=65;y+=5)g.drawArc(7,y,59,10,0,170)
                    g.setColor(LAMP);g.fillRect(16,46,6,4)
                    break
                }
                case 2: { // Floating channel buoy with bands and bell/lantern.
                    g.setColor(NAVY);g.fillPolygon([25,48,58,51] as int[],
                        [41,41,64,64] as int[],4)
                    g.setColor(RUST);g.fillPolygon([28,45,50,31] as int[],
                        [43,43,54,54] as int[],4)
                    g.setColor(CREAM);g.fillRect(30,45,23,6)
                    g.setColor(NAVY);g.setStroke(new BasicStroke(3F))
                    g.drawLine(40,41,40,19);g.drawLine(25,39,40,18)
                    g.drawLine(55,39,40,18)
                    g.setStroke(new BasicStroke(1F))
                    g.setColor(LAMP);g.fillOval(35,15,10,10)
                    g.setColor(INK);g.drawOval(34,14,12,12)
                    g.setColor(SEA)
                    for(int y=56;y<=66;y+=5)g.drawArc(8,y,56,10,0,170)
                    g.setColor(FOAM);g.fillRect(18,59,9,2);g.fillRect(55,62,8,2)
                    break
                }
                case 3: { // Harbor cargo crane: angled boom, dangling container.
                    g.setColor(NAVY);g.setStroke(new BasicStroke(4F))
                    g.drawLine(21,62,29,22);g.drawLine(29,22,59,17)
                    g.drawLine(19,62,52,62)
                    g.setStroke(new BasicStroke(1F))
                    g.setColor(RUST);g.fillRect(24,37,14,25)
                    g.setColor(BLUE);g.fillPolygon([26,45,51] as int[],
                        [25,31,23] as int[],3)
                    g.setColor(INK);g.drawLine(53,18,53,43)
                    g.setColor(SEA);g.fillRect(43,42,24,17)
                    g.setColor(DEEP);g.fillRect(45,45,20,13)
                    g.setColor(FOAM)
                    for(int x=48;x<=61;x+=4)g.fillRect(x,46,1,11)
                    g.setColor(RUST);g.fillRect(8,59,60,5)
                    g.setColor(CREAM);g.fillRect(11,60,8,3)
                    break
                }
                case 4: { // Nautical chart with islands, route and crossed waypoint.
                    g.setColor(CREAM);g.fillRoundRect(11,19,52,46,2,2)
                    g.setColor(SEA)
                    g.fillPolygon([14,29,34,22,16] as int[],
                        [25,29,43,40,38] as int[],5)
                    g.fillPolygon([42,55,59,45,37] as int[],
                        [33,28,39,47,42] as int[],5)
                    g.setColor(NAVY);g.drawRect(13,21,48,42)
                    g.setStroke(new BasicStroke(2F))
                    g.setColor(RUST);g.drawLine(20,54,34,42)
                    g.drawLine(34,42,53,53)
                    g.setStroke(new BasicStroke(1F))
                    g.setColor(BLUE)
                    g.fillOval(17,51,7,7);g.fillOval(49,49,7,7)
                    g.setColor(INK);g.drawLine(49,47,56,57)
                    g.drawLine(56,47,49,57)
                    g.setColor(FOAM);g.fillRect(25,57,21,2)
                    g.setColor(NAVY);g.drawLine(55,25,55,34)
                    break
                }
                case 5: { // Old heavy deep-water diving helmet with round viewport.
                    g.setColor(INK);g.fillRoundRect(16,26,48,39,7,7)
                    g.setColor(RUST);g.fillRoundRect(20,24,40,38,10,10)
                    g.setColor(LAMP);g.fillRect(23,23,34,6)
                    g.setColor(NAVY);g.fillOval(25,31,29,25)
                    g.setColor(FOAM);g.fillOval(29,34,21,19)
                    g.setColor(BLUE);g.fillOval(32,37,15,13)
                    g.setColor(SEA);g.fillOval(34,39,11,10)
                    g.setColor(INK);g.setStroke(new BasicStroke(2F))
                    g.drawOval(25,30,29,26)
                    g.setStroke(new BasicStroke(1F))
                    g.setColor(CREAM)
                    for(int[] dot : [[21,31],[56,31],[23,51],[54,51]]){
                        g.fillOval(dot[0],dot[1],4,4)
                    }
                    g.setColor(NAVY);g.fillRect(13,58,53,7)
                    g.setColor(RUST);g.fillRect(20,63,39,3)
                    break
                }
            }
            g.setColor(NAVY);g.setFont(new Font('SansSerif',Font.BOLD,15))
            g.drawString(WORDS[id][0],70,33)
            g.setColor(DEEP)
            g.setFont(new Font('SansSerif',Font.BOLD,WORDS[id][1].length()>6?10:13))
            g.drawString(WORDS[id][1],70,49)
            g.setColor(SEA);g.fillRect(70,54,46,3)
            g.setColor(INK);g.setFont(new Font('Monospaced',Font.BOLD,8))
            g.drawString(WORDS[id][2],70,65)
            // Salt erosion and ink loss, with real transparent pinholes.
            for(int j=0;j<165;j++){
                int x=6+rng.nextInt(115),y=8+rng.nextInt(64)
                g.setColor(j%3==0?new Color(244,232,201,68):
                           j%3==1?new Color(37,58,89,49):
                           new Color(177,90,66,61))
                g.fillRect(x,y,1+(j%19==0?2:0),1)
            }
            g.setComposite(AlphaComposite.Clear)
            for(int j=0;j<103;j++){
                int x=6+rng.nextInt(115),y=8+rng.nextInt(64)
                g.fillRect(x,y,j%17==0?3:1,1)
            }
            g.setComposite(AlphaComposite.SrcOver)
            g.setClip(null);g.dispose()
            ImageIO.write(img,'png',new File(dir,'blue_'+id+'.png'))
            def output=atlas.createGraphics()
            output.drawImage(img,(id%2)*W,Math.floorDiv(id,2)*H,null)
            output.dispose()
        }
        ImageIO.write(atlas,'png',new File(dir,'blue_atlas.png'))
        println 'Generated six original blue harbor prints and 256x240 atlas.'
    }
}
tasks.named('processResources') {
    dependsOn tasks.named('generateBlueCardboardDecals')
    from(blueDecalOutput)
}
