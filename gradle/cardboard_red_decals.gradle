import java.awt.image.BufferedImage
import java.awt.Color
import java.awt.Font
import java.awt.BasicStroke
import java.awt.Polygon
import java.awt.AlphaComposite
import java.awt.RenderingHints
import javax.imageio.ImageIO

/**
 * Carpet #5 RED: six original, fully clothed, vintage wasteland pin-up poster
 * designs. No copyrighted characters, photos, or external image/font assets.
 * Each 128x80 poster has its own painted scenery, costume and typography.
 * Generated from source so image output can be inspected and reproduced.
 */
def redDecalOutput = layout.buildDirectory.dir('generated/cardboard-red-decals')
tasks.register('generateRedCardboardDecals') {
    inputs.property('red-pinup-art-revision', '2026-11-06-six-unique-posters-v1')
    outputs.dir(redDecalOutput)
    doLast {
        File dir = new File(redDecalOutput.get().asFile,
                'assets/cardboardstealth/textures/decals')
        dir.mkdirs()
        final int W=128, H=80
        final Color INK=new Color(48,36,39)
        final Color CREAM=new Color(239,222,184)
        final Color PAPER=new Color(220,192,154)
        final Color RED=new Color(177,57,67)
        final Color BURGUNDY=new Color(96,37,53)
        final Color GOLD=new Color(219,157,77)
        final Color TEAL=new Color(68,127,125)
        final Color PALE=new Color(255,232,197)
        final Color[] SKIN=[new Color(218,161,123),new Color(195,129,96),
                            new Color(240,187,143),new Color(178,116,87),
                            new Color(220,159,126),new Color(198,128,107)] as Color[]
        final Color[] HAIR=[new Color(79,47,42),new Color(53,42,39),
                            new Color(154,73,45),new Color(51,39,36),
                            new Color(117,66,44),new Color(49,38,62)] as Color[]
        final String[][] WORDS=[
            ['FIX','IT!','GARAGE / 07'],
            ['SKY','ACE','FLIGHT CREW'],
            ['STAY','ALIVE','FIELD MEDIC'],
            ['DESERT','ROSE','WILD HEART'],
            ['ON','AIR','AFTER DARK'],
            ['NEON','RUN','LAST EXIT']
        ] as String[][]
        BufferedImage atlas = new BufferedImage(256,240,BufferedImage.TYPE_INT_ARGB)
        for(int id=0;id<6;id++) {
            java.util.Random rnd = new java.util.Random(1937L+17011L*id)
            BufferedImage img = new BufferedImage(W,H,BufferedImage.TYPE_INT_ARGB)
            def g = img.createGraphics()
            g.setRenderingHint(RenderingHints.KEY_ANTIALIASING,RenderingHints.VALUE_ANTIALIAS_OFF)
            g.setRenderingHint(RenderingHints.KEY_TEXT_ANTIALIASING,RenderingHints.VALUE_TEXT_ANTIALIAS_OFF)
            g.setRenderingHint(RenderingHints.KEY_FRACTIONALMETRICS,RenderingHints.VALUE_FRACTIONALMETRICS_OFF)
            // A torn, slightly offset poster silhouette; outer transparent pixels
            // are essential for layering on different colored cardboard.
            Polygon torn=new Polygon()
            for(int x=5;x<=122;x+=7) torn.addPoint(x,3+rnd.nextInt(6))
            torn.addPoint(125,17);torn.addPoint(121,29);torn.addPoint(125,45)
            torn.addPoint(123,64);torn.addPoint(118,75)
            for(int x=114;x>=8;x-=7) torn.addPoint(x,71+rnd.nextInt(6))
            torn.addPoint(4,65);torn.addPoint(7,45);torn.addPoint(3,27)
            g.setColor(id==5 ? new Color(71,48,72) : (id==2 ? new Color(229,211,185) : CREAM))
            g.fillPolygon(torn)
            g.setClip(torn)
            // Lithograph edge, sun-faded surface and scuffed paper fibers.
            g.setColor(id==5 ? BURGUNDY : RED)
            g.fillRect(6,8,116,3)
            g.fillRect(6,68,116,4)
            g.setColor(id==5 ? TEAL : PAPER)
            g.fillRect(66,12,3,55)
            for(int k=0;k<1100;k++) {
                int x=6+rnd.nextInt(116), y=11+rnd.nextInt(57)
                int a=8+rnd.nextInt(60)
                g.setColor(k%3==0?new Color(76,48,49,a):
                            k%3==1?new Color(175,71,65,a):
                            new Color(255,240,208,a))
                g.fillRect(x,y,1+rnd.nextInt(3),1)
            }
            // Six independent background motifs; not interchangeable recolors.
            switch(id) {
                case 0: { // Garage sign, diagonal rust, spanner, mechanic.
                    g.setColor(new Color(190,137,74))
                    for(int i=-30;i<80;i+=14)g.drawLine(i,65,i+38,15)
                    g.setColor(INK);g.setStroke(new BasicStroke(4F))
                    g.drawLine(60,20,47,36);g.drawOval(55,13,10,10)
                    g.setStroke(new BasicStroke(1F));break
                }
                case 1: { // Pilot insignia, ochre dawn and stylized wings.
                    g.setColor(GOLD);g.fillOval(-20,18,108,74)
                    g.setColor(PALE)
                    for(int i=0;i<4;i++)g.fillRect(4+i*6,54-i*2,20,2)
                    g.setColor(RED);g.drawArc(10,17,48,33,25,145);break
                }
                case 2: { // Medical field-station emblem, linework and rays.
                    g.setColor(RED);g.fillOval(8,18,57,47)
                    g.setColor(CREAM);g.fillRect(30,23,12,34);g.fillRect(20,33,33,12)
                    g.setColor(BURGUNDY)
                    for(int i=0;i<6;i++)g.drawLine(8,15+i*8,15,18+i*8)
                    break
                }
                case 3: { // Desert horizon, cactus, faded rose-bloom silhouette.
                    g.setColor(GOLD);g.fillOval(4,15,59,55)
                    g.setColor(BURGUNDY);g.fillPolygon(
                        [5,29,43,61,61,5] as int[],[62,42,54,39,67,67] as int[],6)
                    g.setColor(TEAL);g.fillRect(11,46,4,19);g.fillRect(7,51,4,7)
                    g.fillRect(15,55,4,4);break
                }
                case 4: { // Vintage radio meters and concentric sound rings.
                    g.setColor(TEAL);g.fillOval(0,8,71,70)
                    g.setColor(CREAM);g.drawOval(-8,14,80,55);g.drawOval(3,20,56,43)
                    g.setColor(BURGUNDY)
                    for(int i=0;i<7;i++)g.fillRect(7+i*8,59-(i%4)*5,3,6+(i%4)*5)
                    break
                }
                case 5: { // Neon urban night with geometric signal streaks.
                    g.setColor(new Color(29,34,53))
                    g.fillRect(7,11,57,56)
                    g.setColor(new Color(221,91,132))
                    for(int i=0;i<5;i++)g.drawLine(7+i*11,61,37+i*9,15)
                    g.setColor(TEAL);g.fillRect(10,50,50,3)
                    g.fillRect(17,55,42,2);break
                }
            }
            // The original pin-up heroine for each poster, with distinctive
            // outfit, hair, headgear and face; no bare/nude figures.
            g.setColor(id==5 ? new Color(198,58,100) : id==1 ? TEAL :
                       id==2 ? new Color(237,234,215) : id==3 ? BURGUNDY :
                       id==4 ? RED : new Color(56,94,97))
            g.fillOval(13,47,48,45)
            g.setColor(HAIR[id]);g.fillOval(18,16,43,49)
            if(id==3)g.fillOval(14,39,50,25) // windblown long hair
            if(id==4){g.fillOval(11,22,17,26);g.fillOval(51,21,16,27)} // curled hair
            g.setColor(SKIN[id]);g.fillOval(27,25,27,32)
            g.setColor(new Color(123,77,67));g.fillRect(49,39,2,2)
            g.setColor(INK);g.fillRect(35,39,4,2);g.fillRect(46,39,4,2)
            g.setColor(RED);g.fillRect(40,49,8,2) // painted lips
            // A headpiece/prop specifically identifies each heroine.
            switch(id) {
                case 0: { // rolled-up workshop bandana, wrench in hand
                    g.setColor(RED);g.fillRect(20,24,37,6)
                    g.setColor(GOLD);g.fillRect(25,25,5,4)
                    g.setColor(INK);g.drawLine(9,59,24,36)
                    g.setColor(PALE);g.fillRect(12,52,8,9);break
                }
                case 1: { // aviator goggles, strapped helmet and silk scarf
                    g.setColor(INK);g.fillArc(21,17,37,31,0,180)
                    g.setColor(GOLD);g.fillRect(26,29,31,7)
                    g.setColor(TEAL);g.fillRect(29,31,11,4);g.fillRect(44,31,10,4)
                    g.setColor(RED);g.fillPolygon([18,37,21,13] as int[],
                            [57,65,71,66] as int[],4);break
                }
                case 2: { // medic cap, useful field jacket and ID strip
                    g.setColor(CREAM);g.fillRect(23,20,37,10)
                    g.setColor(RED);g.fillRect(40,20,5,9);g.fillRect(37,23,12,3)
                    g.setColor(RED);g.fillRect(16,63,11,3);break
                }
                case 3: { // windswept kerchief with rose pin
                    g.setColor(RED);g.fillPolygon([16,24,54,62,57,22] as int[],
                              [22,16,22,32,35,32] as int[],6)
                    g.setColor(GOLD);g.fillOval(51,20,10,10)
                    g.setColor(BURGUNDY);g.fillRect(55,22,2,6);break
                }
                case 4: { // singer's old microphone and round hair bow
                    g.setColor(GOLD);g.fillOval(16,19,12,10)
                    g.setColor(INK);g.fillOval(60,41,9,13)
                    g.fillRect(64,53,2,17)
                    g.setColor(PALE);g.fillRect(63,44,3,7);break
                }
                case 5: { // asymmetrical neon visor and street jacket
                    g.setColor(TEAL);g.fillRect(27,33,29,7)
                    g.setColor(INK);g.fillRect(31,35,21,3)
                    g.setColor(new Color(236,105,149));g.fillPolygon(
                      [21,49,58,63,60,14] as int[],[19,16,30,41,17,27] as int[],6)
                    g.setColor(GOLD);g.fillRect(18,63,14,4);break
                }
            }
            // Printed text: opaque contrast is deliberately high at a distance.
            g.setColor(id==5 ? PALE : BURGUNDY)
            g.setFont(new Font('SansSerif',Font.BOLD,id==3?15:20))
            g.drawString(WORDS[id][0],72,34)
            g.setColor(id==5 ? new Color(238,108,145) : RED)
            g.setFont(new Font('SansSerif',Font.BOLD,id==2?16:20))
            g.drawString(WORDS[id][1],73,54)
            g.setColor(id==5 ? new Color(100,199,187) : INK)
            g.setFont(new Font('Monospaced',Font.BOLD,8))
            g.drawString(WORDS[id][2],70,64)
            // Individual authentic surface wear: transparent tears, faded ink,
            // pin holes and tiny paint flecks, without destroying silhouettes.
            for(int k=0;k<180;k++){
                int x=5+rnd.nextInt(118),y=5+rnd.nextInt(69)
                g.setColor(k%3==0?new Color(255,246,210,75):
                           k%3==1?new Color(75,39,37,48):
                           new Color(190,70,60,58))
                g.fillRect(x,y,1+(k%19==0?2:0),1)
            }
            g.setComposite(AlphaComposite.Clear)
            for(int k=0;k<95;k++){
                int x=6+rnd.nextInt(116),y=8+rnd.nextInt(65)
                g.fillRect(x,y,k%17==0?3:1,1)
            }
            g.setComposite(AlphaComposite.SrcOver)
            g.setClip(null);g.dispose()
            ImageIO.write(img,'png',new File(dir,'red_'+id+'.png'))
            def dst=atlas.createGraphics()
            dst.drawImage(img,(id%2)*W,Math.floorDiv(id,2)*H,null)
            dst.dispose()
        }
        ImageIO.write(atlas,'png',new File(dir,'red_atlas.png'))
        println 'Generated six original red-carpet wasteland pin-up posters (128x80) and atlas (256x240).'
    }
}
tasks.named('processResources') {
    dependsOn tasks.named('generateRedCardboardDecals')
    from(redDecalOutput)
}
