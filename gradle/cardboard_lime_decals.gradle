import java.awt.image.BufferedImage
import java.awt.Color
import java.awt.Font
import java.awt.BasicStroke
import java.awt.Polygon
import java.awt.AlphaComposite
import java.awt.RenderingHints
import javax.imageio.ImageIO

/**
 * Carpet family #8: LIME — six ORIGINAL mutated-botany and spore field posters.
 *
 * Each poster has a different drawn subject (vine, luminous mushroom grove,
 * flooded algae, crystalline bloom, collapsed greenhouse, botanical specimen).
 * Art is generated deterministically with Java2D without external art/font files.
 * Native 128x80 pixels, ripped transparency, screen-printed shading, separate
 * 256x240 atlas. This is not a palette swap from earlier seven families.
 */
def limeDecalOutput=layout.buildDirectory.dir('generated/cardboard-lime-decals')
tasks.register('generateLimeCardboardDecals') {
    inputs.property('lime-botany-art-revision','2026-11-06-six-original-wasteland-botany-v1')
    outputs.dir(limeDecalOutput)
    doLast {
        File dir=new File(limeDecalOutput.get().asFile,
                'assets/cardboardstealth/textures/decals')
        dir.mkdirs()
        final int W=128,H=80
        final Color LIME=new Color(170,218,76)
        final Color GLOW=new Color(218,250,137)
        final Color FOREST=new Color(36,72,62)
        final Color MOSS=new Color(68,128,74)
        final Color TEAL=new Color(57,157,139)
        final Color CREAM=new Color(237,228,171)
        final Color CHARCOAL=new Color(41,46,42)
        final Color RUST=new Color(157,87,58)
        final Color PURPLE=new Color(123,80,131)
        final Color NAVY=new Color(51,64,91)
        final Color[] BASE=[
            new Color(58,90,69),new Color(52,63,71),
            new Color(49,94,89),new Color(69,62,80),
            new Color(68,87,68),new Color(62,86,69)
        ] as Color[]
        final String[][] LABELS=[
            ['GREEN','RETURN','VINE NO.12'],
            ['SPORE','LIGHT','GLOWCAP 08'],
            ['ALGAE','TIDE','FLOOD ZONE'],
            ['THORN','BLOOM','NIGHT ROOT'],
            ['GLASS','HOUSE','SITE 04'],
            ['GROWTH','SAMPLE','CONTAINED?']
        ] as String[][]
        BufferedImage atlas=new BufferedImage(256,240,BufferedImage.TYPE_INT_ARGB)
        for(int id=0;id<6;id++){
            java.util.Random rng=new java.util.Random(350007L+11317L*id)
            BufferedImage img=new BufferedImage(W,H,BufferedImage.TYPE_INT_ARGB)
            def g=img.createGraphics()
            g.setRenderingHint(RenderingHints.KEY_ANTIALIASING,RenderingHints.VALUE_ANTIALIAS_OFF)
            g.setRenderingHint(RenderingHints.KEY_TEXT_ANTIALIASING,RenderingHints.VALUE_TEXT_ANTIALIAS_OFF)
            g.setRenderingHint(RenderingHints.KEY_FRACTIONALMETRICS,RenderingHints.VALUE_FRACTIONALMETRICS_OFF)
            Polygon torn=new Polygon()
            for(int x=4;x<=123;x+=7)torn.addPoint(x,4+rng.nextInt(7))
            torn.addPoint(122,16);torn.addPoint(125,31)
            torn.addPoint(121,46);torn.addPoint(124,62)
            for(int x=118;x>=7;x-=7)torn.addPoint(x,70+rng.nextInt(7))
            torn.addPoint(4,60);torn.addPoint(7,46);torn.addPoint(3,28)
            g.setColor(BASE[id]);g.fillPolygon(torn)
            g.setClip(torn)
            // Plant-like offset stencil frame, amber humidity stains.
            g.setColor(FOREST);g.fillRect(6,10,115,4)
            g.setColor(LIME);g.fillRect(8,13,110,3)
            g.setColor(CREAM);g.fillRect(8,68,110,2)
            g.setColor(TEAL)
            for(int x=11;x<65;x+=7)g.fillRect(x,17,2,3)
            g.setColor(RUST);g.fillRect(65,15,2,51)
            // Screenprint texture: restrained mottling that does not erase art.
            for(int k=0;k<950;k++){
                int x=6+rng.nextInt(116), y=9+rng.nextInt(64)
                int a=8+rng.nextInt(51)
                g.setColor(k%4==0?new Color(240,221,155,a):
                           k%4==1?new Color(24,34,36,a):
                           k%4==2?new Color(101,159,75,a):
                           new Color(188,100,76,a))
                g.fillRect(x,y,1+rng.nextInt(2),1)
            }
            // Distinct hand-painted figures, each fully contained in left 60px.
            switch(id){
                case 0: { // Wild vine winding over a split steel frame.
                    g.setColor(CHARCOAL);g.setStroke(new BasicStroke(3F))
                    g.drawLine(15,59,23,21);g.drawLine(23,21,56,21)
                    g.setStroke(new BasicStroke(1F))
                    g.setColor(LIME);g.setStroke(new BasicStroke(5F))
                    g.drawArc(15,18,37,49,90,230)
                    g.drawArc(11,16,39,36,220,205)
                    g.setStroke(new BasicStroke(1F))
                    g.setColor(MOSS)
                    g.fillOval(13,30,23,9);g.fillOval(37,37,21,11)
                    g.setColor(GLOW)
                    g.fillPolygon([28,36,29,19] as int[],[23,31,38,33] as int[],4)
                    g.fillPolygon([37,46,58,48] as int[],[47,39,41,52] as int[],4)
                    g.setColor(RUST);g.fillOval(45,23,6,6);g.fillOval(34,51,5,5)
                    break
                }
                case 1: { // Fungi shaped as a field of three glowing caps.
                    g.setColor(FOREST);g.fillRect(16,58,49,8)
                    g.setColor(CREAM)
                    g.fillRect(23,40,9,23);g.fillRect(40,33,10,30)
                    g.fillRect(52,45,7,18)
                    g.setColor(PURPLE);g.fillOval(14,28,27,19)
                    g.setColor(TEAL);g.fillOval(31,18,32,23)
                    g.setColor(LIME);g.fillOval(46,36,19,13)
                    g.setColor(GLOW)
                    for(int j=0;j<10;j++){
                        int x=17+rng.nextInt(44),y=24+rng.nextInt(19)
                        g.fillRect(x,y,2+(j%3),2)
                    }
                    g.setColor(GLOW)
                    for(int j=0;j<7;j++)g.fillRect(10+j*8,19+(j%3)*6,2,2)
                    break
                }
                case 2: { // Luminous algae drawn over a flooded road fragment.
                    g.setColor(NAVY);g.fillRect(9,39,54,24)
                    g.setColor(TEAL);g.setStroke(new BasicStroke(3F))
                    for(int yy=44;yy<=62;yy+=8)g.drawArc(8,yy,56,10,12,160)
                    g.setStroke(new BasicStroke(1F))
                    g.setColor(GLOW)
                    for(int j=0;j<8;j++)g.fillOval(13+j*6,37+(j%3)*5,5,3)
                    g.setColor(MOSS);g.fillPolygon([10,26,47,60,64,16] as int[],
                        [40,30,34,26,31,49] as int[],6)
                    g.setColor(LIME);g.drawArc(19,24,36,34,170,190)
                    g.setColor(RUST);g.fillRect(12,27,34,3)
                    break
                }
                case 3: { // Sharp crystalline botanical rose / thorn formation.
                    g.setColor(CHARCOAL);g.setStroke(new BasicStroke(4F))
                    g.drawLine(33,63,38,31)
                    g.setStroke(new BasicStroke(1F))
                    g.setColor(PURPLE)
                    g.fillPolygon([33,41,49,42,52,31,23] as int[],
                        [16,26,20,35,45,39,28] as int[],7)
                    g.setColor(GLOW)
                    g.fillPolygon([34,44,41,34,28] as int[],
                        [18,28,42,38,29] as int[],5)
                    g.setColor(TEAL)
                    g.fillPolygon([22,31,40,32] as int[],
                        [44,48,53,54] as int[],4)
                    g.fillPolygon([40,49,59,47] as int[],
                        [51,43,47,57] as int[],4)
                    g.setColor(LIME)
                    for(int j=0;j<4;j++)g.drawLine(12+j*11,60,20+j*9,46)
                    break
                }
                case 4: { // Old greenhouse roof overtaken by climbing vines.
                    g.setColor(CREAM);g.setStroke(new BasicStroke(2F))
                    g.drawLine(10,41,35,20);g.drawLine(35,20,62,41)
                    g.drawLine(12,40,12,65);g.drawLine(59,40,59,65)
                    g.drawLine(35,20,35,65);g.drawLine(10,40,61,40)
                    g.setStroke(new BasicStroke(1F))
                    g.setColor(TEAL)
                    for(int i=0;i<3;i++)g.drawLine(17+i*14,39,20+i*14,61)
                    g.setColor(LIME);g.setStroke(new BasicStroke(4F))
                    g.drawArc(5,20,40,50,180,170)
                    g.drawArc(29,27,35,44,260,165)
                    g.setStroke(new BasicStroke(1F))
                    g.setColor(GLOW)
                    g.fillOval(13,42,15,8);g.fillOval(41,47,16,7)
                    g.setColor(RUST);g.fillRect(47,59,14,4)
                    break
                }
                case 5: { // Specimen jar: visible unknown crawling plant sample.
                    g.setColor(CREAM);g.fillRoundRect(18,20,37,43,5,5)
                    g.setColor(TEAL);g.fillRect(21,29,31,30)
                    g.setColor(CHARCOAL);g.fillRect(17,18,39,7)
                    g.setColor(RUST);g.fillRect(23,20,27,2)
                    g.setColor(LIME);g.setStroke(new BasicStroke(4F))
                    g.drawArc(27,30,20,27,120,245)
                    g.setStroke(new BasicStroke(1F))
                    g.setColor(GLOW);g.fillOval(28,36,10,7)
                    g.fillOval(38,43,10,7)
                    g.setColor(PURPLE);g.fillOval(36,32,7,8)
                    g.setColor(FOREST)
                    for(int i=0;i<4;i++)g.drawLine(23+i*7,55,29+i*7,49)
                    g.setColor(GLOW);g.drawLine(57,30,62,41)
                    break
                }
            }
            g.setColor(GLOW);g.setFont(new Font('SansSerif',Font.BOLD,13))
            g.drawString(LABELS[id][0],70,33)
            g.setColor(CREAM);g.setFont(new Font('SansSerif',Font.BOLD,13))
            g.drawString(LABELS[id][1],70,49)
            g.setColor(LIME);g.fillRect(69,54,47,3)
            g.setColor(id==3?GLOW:CREAM)
            g.setFont(new Font('Monospaced',Font.BOLD,8))
            g.drawString(LABELS[id][2],69,65)
            // A few organic spores plus chipped ink defects.
            for(int j=0;j<155;j++){
                int x=5+rng.nextInt(118),y=6+rng.nextInt(68)
                g.setColor(j%3==0 ? new Color(200,245,132,95):
                           j%3==1 ? new Color(30,45,35,40):
                           new Color(230,222,189,42))
                g.fillRect(x,y,1+(j%23==0?2:0),1)
            }
            // True pixel transparency; maintain the printed subject integrity.
            g.setComposite(AlphaComposite.Clear)
            for(int j=0;j<103;j++){
                int x=6+rng.nextInt(115),y=8+rng.nextInt(64)
                g.fillRect(x,y,j%17==0?3:1,1)
            }
            g.setComposite(AlphaComposite.SrcOver)
            g.setClip(null);g.dispose()
            ImageIO.write(img,'png',new File(dir,'lime_'+id+'.png'))
            def out=atlas.createGraphics()
            out.drawImage(img,(id%2)*128,Math.floorDiv(id,2)*80,null)
            out.dispose()
        }
        ImageIO.write(atlas,'png',new File(dir,'lime_atlas.png'))
        println 'Generated six original lime mutated-botany illustrations and 256x240 atlas.'
    }
}
tasks.named('processResources') {
    dependsOn tasks.named('generateLimeCardboardDecals')
    from(limeDecalOutput)
}
