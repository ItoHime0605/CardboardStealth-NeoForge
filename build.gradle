plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}
group = 'tw.zonezero'
version = mod_version
base { archivesName = "cardboardstealth-neoforge-${minecraft_version}" }
java { toolchain.languageVersion = JavaLanguageVersion.of(21) }
neoForge {
    version = neo_version
    mods {
        cardboardstealth { sourceSet(sourceSets.main) }
    }
    runs {
        client { client() }
        server { server() }
    }
}
repositories {
    maven { url = 'https://maven.theillusivec4.top/' }
    maven { url = 'https://www.cursemaven.com/' }
}
dependencies {
    compileOnly 'top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1:api'
    runtimeOnly 'top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1'
    // TaCZ r7 is an optional dependency at runtime (strictly needed for this feature).
    compileOnly 'curse.maven:tacz-1-21-1-1353462:9027337'
    compileOnly 'curse.maven:zombie-awareness-237754:5731744'
    runtimeOnly 'curse.maven:zombie-awareness-237754:5731744'
    // Required by Zombie Awareness when running the mod in a local development game.
    runtimeOnly 'curse.maven:coroutil-237749:7796187'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// Pixel-art resources are generated from checked-in source during the build.
apply from: 'gradle/cardboard_textures.gradle'
apply from: 'gradle/cardboard_decals.gradle'
apply from: 'gradle/cardboard_light_gray_decals.gradle'
apply from: 'gradle/cardboard_gray_decals.gradle'
apply from: 'gradle/cardboard_black_decals.gradle'
apply from: 'gradle/cardboard_red_decals.gradle'
apply from: 'gradle/cardboard_orange_decals.gradle'
apply from: 'gradle/cardboard_yellow_decals.gradle'
apply from: 'gradle/cardboard_lime_decals.gradle'
apply from: 'gradle/cardboard_pink_decals.gradle'
apply from: 'gradle/cardboard_brown_decals.gradle'
apply from: 'gradle/cardboard_green_decals.gradle'
apply from: 'gradle/cardboard_cyan_decals.gradle'
apply from: 'gradle/cardboard_blue_decals.gradle'
apply from: 'gradle/cardboard_purple_decals.gradle'
apply from: 'gradle/cardboard_magenta_decals.gradle'
apply from: 'gradle/cardboard_light_blue_decals.gradle'
apply from: 'gradle/cardboard_printed_stickers.gradle'
