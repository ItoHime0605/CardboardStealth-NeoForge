plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}
group = 'tw.zonezero'
version = mod_version
base { archivesName = "cardboardstealth-neoforge-${minecraft_version}" }
java { toolchain.languageVersion = JavaLanguageVersion.of(21) }
neoForge {
    version = neo_version
    mods {
        cardboardstealth { sourceSet(sourceSets.main) }
    }
    runs {
        client { client() }
        server { server() }
    }
}
repositories {
    maven { url = 'https://maven.theillusivec4.top/' }
    maven { url = 'https://www.cursemaven.com/' }
}
dependencies {
    compileOnly 'top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1:api'
    runtimeOnly 'top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1'
    compileOnly 'curse.maven:zombie-awareness-237754:5731744'
    runtimeOnly 'curse.maven:zombie-awareness-237754:5731744'
    // Zombie Awareness declares CoroUtil as a required runtime dependency.
    runtimeOnly 'curse.maven:coroutil-237749:7796187'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
